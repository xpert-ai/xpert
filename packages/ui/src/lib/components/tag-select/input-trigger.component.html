<div [class]="classes()" [attr.data-disabled]="disabled() ? '' : null" (mousedown)="onContainerMouseDown($event)">
  <div class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5">
    @for (item of items(); track item.key; let index = $index) {
      <z-tag-select-chip
        class="min-w-0 max-w-full"
        [label]="item.label"
        [disabled]="disabled()"
        [removable]="!disabled()"
        (removed)="chipRemove.emit(index)"
      />
    }

    @if (canInput()) {
      <input
        #inputElement
        class="h-6 w-0 min-w-[10ch] flex-1 border-0 bg-transparent p-0 text-sm leading-5 text-foreground outline-none placeholder:text-muted-foreground disabled:cursor-not-allowed"
        [disabled]="disabled()"
        [placeholder]="items().length ? '' : placeholder()"
        [attr.aria-label]="placeholder() || null"
        [value]="inputValue()"
        (input)="onInput($event)"
        (keydown)="inputKeydown.emit($event)"
        (paste)="inputPaste.emit($event)"
        (focus)="inputFocus.emit()"
        (blur)="inputBlur.emit()"
      />
    } @else if (!items().length) {
      <span class="text-muted-foreground">{{ placeholder() }}</span>
    }
  </div>

  @if ((clearable() && showClear()) || showSuggestionsIndicator()) {
    <div class="inline-flex shrink-0 items-center gap-1.5 text-muted-foreground">
      @if (clearable() && showClear()) {
        <button
          type="button"
          class="inline-flex size-5 items-center justify-center rounded-sm transition-colors hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/50"
          [disabled]="disabled()"
          aria-label="Clear selected items"
          (mousedown)="$event.preventDefault()"
          (click)="onClear($event)"
        >
          <z-icon zType="x" class="size-3.5" />
        </button>
      }

      @if (showSuggestionsIndicator()) {
        <span
          data-slot="tag-select-suggestions-indicator"
          class="inline-flex size-4 items-center justify-center transition-transform"
          [class.rotate-180]="suggestionsOpen()"
          aria-hidden="true"
        >
          <z-icon zType="chevron-down" class="size-4" />
        </span>
      }
    </div>
  }
</div>
