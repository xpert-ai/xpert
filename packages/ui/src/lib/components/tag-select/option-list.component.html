<div [class]="listClasses" role="listbox">
  @if (options().length) {
    @for (option of options(); track option.label + ':' + $index; let index = $index) {
      <div
        #optionElement
        role="option"
        [attr.aria-selected]="checkable() ? isSelected(option) : activeIndex() === index"
        [class]="optionClasses(index, !!option.disabled)"
        (mousedown)="onMouseDown($event)"
        (mouseenter)="onMouseEnter(index)"
        (click)="onOptionClick(option)"
      >
        @if (checkable()) {
          <z-checkbox
            class="pointer-events-none min-w-0 w-full"
            labelClass="min-w-0 flex-1 text-sm leading-5 font-normal"
            [ngModel]="isSelected(option)"
          >
            <span class="block truncate" [title]="option.label">{{ option.label }}</span>
          </z-checkbox>
        } @else {
          <span class="truncate" [title]="option.label">{{ option.label }}</span>
        }
      </div>
    }
  } @else {
    <div [class]="emptyClasses">{{ emptyText() }}</div>
  }
</div>
