<div [class]="listClasses" role="listbox">
  @if (options().length) {
    @for (option of options(); track option.label + ':' + $index; let index = $index) {
      <div
        #optionElement
        role="option"
        [attr.aria-selected]="checkable() ? isSelected(option) : activeIndex() === index"
        [class]="optionClasses(index, !!option.disabled)"
        (mousedown)="onMouseDown($event)"
        (mouseenter)="onMouseEnter(index)"
        (click)="onOptionClick(option)"
      >
        @if (checkable()) {
          <z-checkbox class="pointer-events-none w-full" [ngModel]="isSelected(option)">
            <span class="truncate">{{ option.label }}</span>
          </z-checkbox>
        } @else {
          <span class="truncate">{{ option.label }}</span>
        }
      </div>
    }
  } @else {
    <div [class]="emptyClasses">{{ emptyText() }}</div>
  }
</div>
