<div xpDialogLayout="standard" class="w-[480px] max-w-full max-h-[85dvh]">
  <header xpDialogHeader cdkDrag cdkDragRootElement=".cdk-overlay-pane">
    <h2 cdkDragHandle class="cursor-move" xpDialogHeading>{{ data?.information }}</h2>
    <button
      type="button"
      z-button
      zType="ghost"
      zSize="icon"
      xpDialogCloseButton
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="cancel()"
    >
      <z-icon zType="x" />
    </button>
  </header>
  <div xpDialogBody>
    <formly-form
      class="w-full"
      [form]="formGroup"
      [fields]="fields()"
      [model]="model"
      (modelChange)="onModelChange($event)"
      [options]="options"
    />
  </div>
  <footer xpDialogFooter>
    <button type="button" z-button zType="outline" (click)="cancel()">
      {{ 'COMPONENTS.COMMON.CANCEL' | translate: { Default: 'Cancel' } }}</button
    ><button type="button" z-button zType="default" [zDisabled]="formGroup.invalid" cdkFocusInitial (click)="apply()">
      {{ 'COMPONENTS.COMMON.CONFIRM' | translate: { Default: 'Confirm' } }}
    </button>
  </footer>
</div>
