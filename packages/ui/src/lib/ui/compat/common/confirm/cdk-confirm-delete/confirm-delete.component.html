<section xpDialogLayout="standard" class="max-h-[calc(100dvh-2rem)]">
  <header cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle xpDialogHeader class="cursor-move">
    <h2 xpDialogHeading class="pointer-events-none">
      @if (title()) {
        {{ title() }}
      } @else {
        {{ 'COMPONENTS.CONFIRM.DELETE' | translate: { Default: 'Confirm Delete' } }}
        @if (value()) {
          [<span class="font-bold">{{ value() }}</span
          >]
        }
        ?
      }
    </h2>
  </header>

  <div xpDialogBody class="text-muted-foreground">
    <div class="whitespace-pre-line">{{ information() }}</div>
  </div>

  <footer xpDialogFooter>
    <button type="button" z-button zType="outline" cdkFocusInitial (click)="dialogRef.close()">
      {{ 'COMPONENTS.COMMON.CANCEL' | translate: { Default: 'Cancel' } }}
    </button>
    <button type="button" z-button zType="destructive" (click)="dialogRef.close(true)">
      {{ 'COMPONENTS.COMMON.Confirm' | translate: { Default: 'Confirm' } }}
    </button>
  </footer>
</section>
