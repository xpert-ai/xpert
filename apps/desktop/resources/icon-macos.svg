    <path d="M493 154 L343 304 L493 459" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" />
    <path d="M479 254 L429 304 L482 357" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter" />
