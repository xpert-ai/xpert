<ng-template #headerSearchIcon>
  <z-icon zType="search" zSize="sm" />
</ng-template>

<div
  class="relative isolate min-h-full overflow-auto bg-background"
  style="
    background-image: radial-gradient(
      circle,
      color-mix(in oklab, var(--primary) 18%, transparent) 1px,
      transparent 1px
    );
    background-size: 20px 20px;
  "
>
  <header class="sticky top-0 z-20 border-b border-border/60 bg-background/90 backdrop-blur-xl">
    <div class="flex flex-col gap-3 px-3 py-3 sm:px-6 xl:px-10">
      <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <nav
          class="flex w-fit max-w-full items-center gap-1 overflow-x-auto"
          aria-label="{{ 'XP.Explore.NavigationLabel' | translate: { Default: 'Marketplace navigation' } }}"
        >
          <button
            type="button"
            class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg px-3 text-base font-semibold transition-colors enabled:hover:bg-muted enabled:hover:text-foreground"
            [class]="
              tab() === 'agent-square'
                ? 'bg-primary text-primary-foreground enabled:hover:bg-primary/90 enabled:hover:text-primary-foreground'
                : 'text-muted-foreground'
            "
            [class.cursor-not-allowed]="!agentMarketplaceEnabled()"
            [class.cursor-pointer]="agentMarketplaceEnabled()"
            [class.opacity-50]="!agentMarketplaceEnabled()"
            [disabled]="!agentMarketplaceEnabled()"
            [attr.aria-pressed]="tab() === 'agent-square'"
            (click)="setTab('agent-square')"
          >
            <i class="ri-team-line text-base"></i>
            {{ 'XP.Explore.ExpertsTab' | translate: { Default: 'Experts' } }}
          </button>
          <button
            type="button"
            class="inline-flex h-9 shrink-0 cursor-pointer items-center gap-2 rounded-lg px-3 text-base font-semibold transition-colors hover:bg-muted hover:text-foreground"
            [class]="
              tab() === 'skills'
                ? 'bg-primary text-primary-foreground hover:bg-primary/90 hover:text-primary-foreground'
                : 'text-muted-foreground'
            "
            [attr.aria-pressed]="tab() === 'skills'"
            (click)="setTab('skills')"
          >
            <i class="ri-pencil-ruler-line text-base"></i>
            {{ 'XP.Explore.SkillsTab' | translate: { Default: 'Skills' } }}
          </button>
          <button
            type="button"
            class="inline-flex h-9 shrink-0 cursor-pointer items-center gap-2 rounded-lg px-3 text-base font-semibold transition-colors hover:bg-muted hover:text-foreground"
            [class]="
              tab() === 'connectors'
                ? 'bg-primary text-primary-foreground hover:bg-primary/90 hover:text-primary-foreground'
                : 'text-muted-foreground'
            "
            [attr.aria-pressed]="tab() === 'connectors'"
            (click)="setTab('connectors')"
          >
            <i class="ri-plug-line text-base"></i>
            {{ 'XP.Explore.ConnectorsTab' | translate: { Default: 'Connectors' } }}
          </button>
        </nav>

        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-end">
          <z-input-group class="w-full sm:w-[360px]" zSize="default" [zAddonBefore]="headerSearchIcon">
            <input
              z-input
              zSize="default"
              class="pr-8"
              [placeholder]="
                tab() === 'skills'
                  ? ('XP.Explore.SkillSearchPlaceholder'
                    | translate: { Default: 'Search skill name, description, or tags' })
                  : ('XP.Explore.AgentSquare.SearchExpertsPlaceholder'
                    | translate: { Default: 'Search experts, scenarios, or capabilities' })
              "
              [(ngModel)]="search"
            />
          </z-input-group>

          @if (search()) {
            <button
              z-button
              zType="ghost"
              zSize="default"
              type="button"
              class="cursor-pointer sm:-ml-11"
              (click)="clearSearch()"
            >
              <z-icon zType="x" zSize="sm" />
            </button>
          }

          @if (tab() === 'skills') {
            <button
              z-button
              zType="outline"
              zSize="default"
              type="button"
              class="cursor-pointer"
              (click)="openSkillManagement()"
            >
              <z-icon zType="archive" zSize="sm" />
              {{ 'XP.Explore.InstalledSkills' | translate: { Default: 'Installed' } }}
              <span
                class="ml-1 inline-flex size-6 items-center justify-center rounded-full bg-secondary px-1 text-sm font-semibold text-secondary-foreground"
                >{{ installedSkillsCount() }}</span
              >
            </button>

            <button
              z-button
              zSize="default"
              type="button"
              z-menu
              zPlacement="bottomRight"
              [zMenuTriggerFor]="createMenu"
              class="cursor-pointer bg-primary text-primary-foreground hover:bg-primary/90"
            >
              <z-icon zType="plus" zSize="sm" />
              {{ 'XP.Explore.AddSkill' | translate: { Default: 'Add skill' } }}
              <z-icon zType="chevron-down" zSize="sm" />
            </button>
          }
        </div>
      </div>
    </div>
  </header>

  <ng-template #createMenu>
    <div z-menu-content class="w-64 p-2">
      <button type="button" z-menu-item (click)="openSkillManagement()">
        <z-icon zType="upload" zSize="sm" />
        {{ 'XP.Explore.UploadSkillPackage' | translate: { Default: 'Upload skill package' } }}
      </button>
      <button type="button" z-menu-item (click)="openInstallFromRepository()">
        <z-icon zType="search" zSize="sm" />
        {{ 'XP.Explore.InstallFromRepository' | translate: { Default: 'Install from repository' } }}
      </button>
      <button type="button" z-menu-item (click)="openSkillManagement()">
        <z-icon zType="folder-open" zSize="sm" />
        {{ 'XP.Explore.OpenWorkspaceSkills' | translate: { Default: 'Open workspace skills' } }}
      </button>
    </div>
  </ng-template>

  <main class="block px-3 pb-8 pt-5 sm:px-6 xl:px-10">
    @switch (tab()) {
      @case ('agent-square') {
        @if (agentMarketplaceEnabled()) {
          <xp-explore-agent-square [search]="search()" [workspace]="defaultWorkspace()" />
        }
      }
      @default {
        <xp-explore-skills
          [mode]="mode()"
          [search]="search()"
          [workspace]="defaultWorkspace()"
          [installFromRepositoryNonce]="installFromRepositoryNonce()"
          (installedCountChange)="installedSkillsCount.set($event)"
          (searchChange)="search.set($event)"
        />
      }
    }
  </main>
</div>
