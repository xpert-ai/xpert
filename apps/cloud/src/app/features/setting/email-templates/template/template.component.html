<form [formGroup]="form" class="flex w-full min-w-0 flex-col gap-6" (ngSubmit)="submitForm()">
  <header class="flex flex-wrap items-start justify-between gap-4">
    <div class="space-y-3">
      <button z-button zType="ghost" zSize="sm" type="button" (click)="close()">
        <z-icon zType="arrow-left" />{{ 'XP.SettingsRemaining.BackToTemplates' | translate }}
      </button>
      <h1 class="break-all text-2xl font-semibold tracking-tight">{{ name() }}</h1>
      <p class="text-sm text-muted-foreground">
        {{ languageCode() }}
        @if (organization?.name) {
          · {{ organization.name }}
        }
      </p>
    </div>
    <button z-button type="submit" [zDisabled]="form.invalid || form.pristine">
      <z-icon zType="save" />{{ 'XP.ACTIONS.Save' | translate }}
    </button>
  </header>
  <div class="grid min-w-0 gap-6 xl:grid-cols-2">
    <section class="min-w-0 space-y-4">
      <div class="overflow-hidden rounded-lg border border-border">
        <h2 class="border-b border-border bg-muted/30 px-4 py-3 text-sm font-medium">
          {{ 'XP.KEY_WORDS.Subject' | translate }}
        </h2>
        <ngx-monaco-editor
          class="block h-24!"
          [options]="{
            theme: theme(),
            automaticLayout: true,
            language: 'sql'
          }"
          formControlName="subject"
        ></ngx-monaco-editor>
      </div>
      <div class="overflow-hidden rounded-lg border border-border">
        <h2 class="border-b border-border bg-muted/30 px-4 py-3 text-sm font-medium">
          {{ 'XP.KEY_WORDS.EmailBody' | translate }}
        </h2>
        <ngx-monaco-editor
          class="block h-72! xl:h-[30rem]!"
          [options]="{
            theme: theme(),
            automaticLayout: true,
            language: 'html'
          }"
          formControlName="mjml"
        ></ngx-monaco-editor>
      </div>
    </section>
    <section class="min-w-0 overflow-hidden rounded-lg border border-border">
      <h2 class="border-b border-border bg-muted/30 px-4 py-3 text-sm font-medium">
        {{ 'XP.SettingsRemaining.Preview' | translate }}
      </h2>
      <div class="space-y-4 p-4">
        <div class="border-b border-border pb-4">
          <p class="mb-2 text-xs text-muted-foreground">{{ 'XP.KEY_WORDS.Subject' | translate }}</p>
          <div id="previewSubject" class="break-words" [innerHtml]="previewSubject"></div>
        </div>
        <div class="max-h-[36rem] overflow-auto"><div id="previewEmail" [innerHtml]="previewEmail()"></div></div>
      </div>
    </section>
  </div>
</form>
