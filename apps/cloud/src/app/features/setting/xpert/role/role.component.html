<div class="flex-1 flex flex-col items-start overflow-auto lg:flex-row">
  <form class="flex flex-col gap-2 p-4 w-full lg:w-[400px] lg:max-w-[400px]" [formGroup]="formGroup">
    <xp-avatar-editor formControlName="avatar" class="w-24 h-24 self-center m-8" />

    <xp-input
      class="flex-1"
      [label]="'XP.Copilot.Roles.Name' | translate: { Default: 'Name' }"
      valueKey="key"
      formControlName="name"
    />

    <xp-input
      class="flex-1"
      [label]="'XP.Copilot.Roles.Title' | translate: { Default: 'Title' }"
      valueKey="key"
      formControlName="title"
    />

    <xp-input
      class="flex-1"
      [label]="'XP.Copilot.Roles.TitleCN' | translate: { Default: 'Title (CN)' }"
      valueKey="key"
      formControlName="titleCN"
    />

    <xp-input
      class="flex-1"
      [label]="'XP.Copilot.Roles.Description' | translate: { Default: 'Description' }"
      valueKey="key"
      formControlName="description"
    />

    <div class="flex-1 min-w-full flex flex-col">
      <label class="xp-input-label shrink-0">{{ 'XP.Copilot.Roles.Prompt' | translate: { Default: 'Prompt' } }}</label>
      <textarea
        class="xp-input-element"
        z-input
        formControlName="prompt"
        cdkTextareaAutosize
        cdkAutosizeMinRows="2"
        cdkAutosizeMaxRows="8"
      ></textarea>
    </div>

    <div class="flex flex-col" formArrayName="starters">
      <label class="xp-input-label shrink-0">{{
        'XP.Copilot.Roles.Starters' | translate: { Default: 'Starters' }
      }}</label>
      <xp-input
        class="w-full"
        formControlName="0"
        [placeholder]="
          'XP.Copilot.Roles.FrequentlyQuestion' | translate: { Default: 'Frequently asked questions by users' }
        "
      />
      <xp-input
        class="w-full"
        formControlName="1"
        [placeholder]="
          'XP.Copilot.Roles.FrequentlyQuestion' | translate: { Default: 'Frequently asked questions by users' }
        "
      />
      <xp-input
        class="w-full"
        formControlName="2"
        [placeholder]="
          'XP.Copilot.Roles.FrequentlyQuestion' | translate: { Default: 'Frequently asked questions by users' }
        "
      />
      <xp-input
        class="w-full"
        formControlName="3"
        [placeholder]="
          'XP.Copilot.Roles.FrequentlyQuestion' | translate: { Default: 'Frequently asked questions by users' }
        "
      />
    </div>
  </form>

  <div class="w-full flex-1 flex flex-col p-4">
    <h2 class="p-2 text-lg">{{ 'XP.KEY_WORDS.Knowledgebases' | translate: { Default: 'Knowledgebases' } }}</h2>
    <div class="max-h-[200px] overflow-auto">
      <xp-knowledgebase-list
        class="w-full"
        [knowledgebaseList]="knowledgebaseList()"
        [(knowledgebases)]="knowledgebases"
      />
    </div>

    <h2 class="my-2 p-2 text-lg">{{ 'XP.KEY_WORDS.Toolset' | translate: { Default: 'Toolset' } }}</h2>
    <div class="max-h-[200px] overflow-auto">
      <xp-toolset-list class="w-full" [toolsetList]="toolsetList()" [(toolsets)]="toolsets" />
    </div>

    <div class="flex-1 min-w-full flex flex-col">
      <label class="my-2 p-2 text-lg shrink-0">{{
        'XP.Copilot.Roles.ToolOptions' | translate: { Default: 'Tool Options' }
      }}</label>
      <textarea
        class="xp-input-element"
        z-input
        [formControl]="options"
        cdkTextareaAutosize
        cdkAutosizeMinRows="2"
        cdkAutosizeMaxRows="8"
      ></textarea>
    </div>
  </div>
</div>

<div class="flex justify-between items-center p-4">
  <div></div>
  <div class="flex items-center gap-1">
    <button z-button zType="ghost" (click)="close()">
      {{ 'XP.KEY_WORDS.Cancel' | translate: { Default: 'Cancel' } }}
    </button>
    <button
      z-button
      zType="default"
      [disabled]="loading() || formGroup.invalid || formGroup.pristine"
      (click)="saveAll()"
    >
      {{ 'XP.KEY_WORDS.Save' | translate: { Default: 'Save' } }}
    </button>
  </div>
</div>

@if (loading()) {
  <div class="absolute w-full h-full flex justify-center items-center">
    <z-loader diameter="26" />
  </div>
}
