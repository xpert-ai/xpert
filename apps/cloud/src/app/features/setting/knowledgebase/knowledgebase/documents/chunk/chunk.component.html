<div class="flex justify-between items-center p-4">
  <div>{{ 'XP.Knowledgebase.Chunks' | translate: { Default: 'Chunks' } }}: {{ total() }}</div>
  <div class="flex items-center gap-1">
    <button z-button zType="ghost" (click)="close()">
      {{ 'XP.KEY_WORDS.Cancel' | translate: { Default: 'Cancel' } }}
    </button>
  </div>
</div>

<div class="p-4 overflow-auto" waIntersectionObserver waIntersectionThreshold="0.5">
  <ul role="list" class="example-list-wrapping m-2">
    @for (chunk of chunks(); track chunk.id) {
      <li role="listitem" class="p-4 rounded-lg hover:bg-hover-bg dark:hover:bg-white/10">
        <div class="mb-2 flex justify-between items-center">
          <button
            z-button
            zType="destructive"
            zSize="icon-xs"
            zShape="circle"
            [zTooltip]="'XP.Knowledgebase.DeleteChunk' | translate: { Default: 'Delete Chunk' }"
            (click)="deleteChunk(chunk)"
          >
            <z-icon zType="delete"></z-icon>
          </button>
        </div>
        <span>{{ chunk.content }}</span>
      </li>
    }

    <div (waIntersectionObservee)="onIntersection()" class="p-4"></div>
  </ul>
</div>
