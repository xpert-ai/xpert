<div class="mx-auto flex w-full min-w-0 max-w-7xl flex-col gap-6 px-4 py-6 md:px-8 md:py-8">
  <header class="flex flex-wrap items-start justify-between gap-4">
    <div class="space-y-2">
      <h1 class="text-2xl font-semibold tracking-tight">{{ 'XP.MENU.MANAGE_FEATURES' | translate }}</h1>
      <p class="text-sm text-muted-foreground">{{ 'XP.SettingsRemaining.FeaturesDescription' | translate }}</p>
    </div>
    @if (canUpgrade()) {
      <button z-button zType="outline" type="button" [zDisabled]="loading()" (click)="upgrade()">
        <i class="ri-loop-left-line" aria-hidden="true"></i>{{ 'XP.KEY_WORDS.Upgrade' | translate }}
      </button>
    }
  </header>
  <div class="min-w-0"><router-outlet /></div>
</div>
@if (loading()) {
  <xp-spin class="absolute inset-0" />
}
