<section xpDialogLayout="wide" xpDialogPurpose="workflow" class="w-[min(640px,calc(100vw-32px))] max-h-[84dvh]">
  <header cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle xpDialogHeader>
    <h2 xpDialogHeading>
      {{ 'XP.ACTIONS.NEW' | translate: { Default: 'New' } }}
      {{ 'XP.KEY_WORDS.ORGANIZATION' | translate: { Default: 'Organization' } }}
    </h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="onCancel()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>

  <div xpDialogBody>
    <xp-organization-step-form #stepForm [(ngModel)]="organization"></xp-organization-step-form>
  </div>

  <footer xpDialogFooter>
    <button z-button zType="outline" cdkFocusInitial (click)="onCancel()">
      {{ 'XP.ACTIONS.CANCEL' | translate: { Default: 'Cancel' } }}
    </button>

    <button z-button zType="default" (click)="onApply()">
      {{ 'XP.ACTIONS.APPLY' | translate: { Default: 'Apply' } }}
    </button>
  </footer>
</section>
