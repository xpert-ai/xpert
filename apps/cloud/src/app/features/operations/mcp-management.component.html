<div class="flex h-full min-h-0 w-full min-w-0 flex-1 flex-col overflow-hidden bg-background-default">
  <div class="xp-page-header shrink-0">
    <div class="min-w-0">
      <div class="xp-page-title">
        {{ 'XP.Operations.McpManagementTitle' | translate: { Default: 'MCP management' } }}
      </div>
      <div class="mt-1 text-sm text-text-tertiary">
        {{
          'XP.Operations.McpManagementDescription'
            | translate: { Default: 'Publish MCP services and inspect runtime instances started on demand.' }
        }}
      </div>
    </div>
  </div>

  <div class="flex min-h-0 min-w-0 flex-1 overflow-hidden">
    @if (activeSection() === 'services') {
      <xp-mcp-publications />
    } @else {
      <xp-mcp-runtimes />
    }
  </div>
</div>
