<div class="workspace-files-page">
  @if (xpertId()) {
    <xp-file-workbench
      class="workspace-files-page__workbench"
      layout="library"
      [rootId]="xpertId()"
      [navigationTitle]="'XP.WorkspaceFiles.Title' | translate: { Default: 'Resource library' }"
      [treeTitle]="'XP.WorkspaceFiles.WorkspaceFiles' | translate: { Default: 'Workspace files' }"
      [searchPlaceholder]="'XP.WorkspaceFiles.SearchPlaceholder' | translate: { Default: 'Search workspace files' }"
      [rootLabel]="'XP.WorkspaceFiles.RootLabel' | translate: { Default: 'Claw Xpert workspace files' }"
      [filesLoader]="loadFiles"
      [fileLoader]="loadFile"
      [fileSaver]="saveFile"
      [fileUploader]="uploadFile"
      [fileDeleter]="deleteFile"
      [fileDownloader]="downloadFile"
    />
  } @else {
    <div class="workspace-files-page__empty">
      <i class="ri-folder-open-line"></i>
      <div>{{ 'XP.WorkspaceFiles.Unavailable' | translate: { Default: 'Configure Claw Xpert first.' } }}</div>
    </div>
  }
</div>
