@if (connection().type === 'toolset') {
  <span class="text-sm">
    {{ 'XP.Xpert.ToolsCall' | translate: { Default: 'Tools Call' } }}:
    @if (selectedAll()) {
      <span class="mx-1 font-semibold text-text-success">{{ 'XP.Xpert.All' | translate: { Default: 'All' } }}</span>
    } @else {
      <span class="mx-1 font-semibold text-text-warning">{{
        'XP.Xpert.Partial' | translate: { Default: 'Partial' }
      }}</span>
    }
  </span>
}
