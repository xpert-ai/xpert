<textarea
  rows="3"
  class="xp-input system-md-regular w-full border-0 text-text-secondary"
  [placeholder]="'XP.Xpert.WriteOpenerMessage' | translate: { Default: 'Write your opener message here.' }"
  [(ngModel)]="message"
></textarea>
<div>
  <div class="flex items-center py-2">
    <div class="flex shrink-0 space-x-0.5 text-xs font-medium leading-[18px] text-text-tertiary">
      <div class="uppercase">{{ 'XP.Xpert.OpeningQuestions' | translate: { Default: 'Opening Questions' } }}</div>
      <div>·</div>
      <div>{{ questions()?.length ?? 0 }}/10</div>
    </div>
    <div
      class="my-2 bg-gradient-to-r from-divider-regular to-background-gradient-mask-transparent ml-3 h-px w-0 grow"
    ></div>
  </div>
  <div class="space-y-1" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (question of questions(); track i; let i = $index) {
      <div
        class="group relative flex items-center rounded-lg border border-divider-subtle bg-components-card-bg pl-2.5 hover:bg-hover-bg"
        cdkDrag
        cdkDragLockAxis="y"
      >
        <i class="ri-draggable cursor-pointer"></i>
        <div class="min-w-0 flex-1 py-2 pr-8">
          <input
            class="xp-input w-full border-0 text-sm"
            [placeholder]="'XP.XpertSettings.QuestionLabel' | translate"
            [attr.aria-label]="('XP.XpertSettings.QuestionLabel' | translate) + ' ' + (i + 1)"
            [ngModel]="questionLabel(question)"
            (ngModelChange)="updateQuestion(i, 'label', $event)"
          />
          <textarea
            class="xp-input w-full border-0 text-sm"
            rows="2"
            [placeholder]="'XP.XpertSettings.QuestionPrompt' | translate"
            [attr.aria-label]="('XP.XpertSettings.QuestionPrompt' | translate) + ' ' + (i + 1)"
            [ngModel]="questionPrompt(question).prompt"
            (ngModelChange)="updateQuestion(i, 'prompt', $event)"
          ></textarea>
        </div>
        <div
          class="absolute right-1.5 top-1/2 translate-y-[-50%] cursor-pointer rounded-md w-6 h-6 flex justify-center items-center text-text-tertiary hover:bg-status-error-bg hover:text-text-destructive"
          (click)="removeQuestion(i)"
        >
          <i class="ri-delete-bin-3-line"></i>
        </div>
      </div>
    }
  </div>

  <div
    class="mt-1 flex h-9 cursor-pointer items-center gap-2 rounded-lg bg-components-input-bg-normal px-3 text-text-tertiary hover:bg-hover-bg"
    (click)="addQuestion()"
  >
    <i class="ri-add-line"></i>
    <div class="system-sm-medium text-[13px]">
      {{ 'XP.Xpert.AddQuestion' | translate: { Default: 'Add Question' } }}
    </div>
  </div>
</div>
