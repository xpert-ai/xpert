<section xpDialogLayout="wide" xpDialogPurpose="workflow" class="w-[min(880px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
    <h2 xpDialogHeading>{{ 'XP.Xpert.CreateToolset' | translate: { Default: 'Create Toolset' } }}</h2>
    <button
      z-button
      zType="ghost"
      type="button"
      xpDialogCloseButton
      zSize="icon"
      [zDisabled]="loading()"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="cancel()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody>
    <ul
      class="grid grid-cols-2 gap-2 rounded-lg bg-muted p-1"
      cdkListbox
      [cdkListboxDisabled]="loading()"
      [(ngModel)]="providerTypes"
    >
      <li
        #openapi="cdkOption"
        cdkOption="openapi"
        class="cursor-pointer rounded-md p-3 text-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
        [class]="openapi.isSelected() ? 'bg-background font-medium shadow-sm' : ''"
      >
        OpenAPI
      </li>
      <li
        #odata="cdkOption"
        cdkOption="odata"
        class="cursor-pointer rounded-md p-3 text-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
        [class]="odata.isSelected() ? 'bg-background font-medium shadow-sm' : ''"
      >
        OData
      </li>
    </ul>
    <div [attr.inert]="loading() ? '' : null">
      @switch (providerTypes()[0]) {
        @case ('openapi') {
          <xpert-tool-openapi-configure #configure (valueChange)="onValueChange($event)" />
        }
        @case ('odata') {
          <xpert-tool-odata-configure #configure (valueChange)="onValueChange($event)" />
        }
      }
    </div>
  </div>
  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" [zDisabled]="loading()" (click)="cancel()">
      {{ 'XP.ACTIONS.Cancel' | translate: { Default: 'Cancel' } }}</button
    ><button
      z-button
      zType="default"
      type="button"
      [zDisabled]="loading() || !configure()?.isValid()"
      [zLoading]="loading()"
      (click)="createTool()"
    >
      <z-icon zType="plus" aria-hidden="true" />{{ 'XP.ACTIONS.Create' | translate: { Default: 'Create' } }}
    </button>
  </footer>
</section>
