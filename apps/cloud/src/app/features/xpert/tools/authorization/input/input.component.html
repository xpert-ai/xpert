<label class="block space-y-2"
  ><span>{{ 'XP.Xpert.AuthorizationMethod' | translate: { Default: 'Authorization Method' } }}</span
  ><button
    xpDialogControl="single"
    type="button"
    [class]="controlClasses + ' items-center justify-between gap-2 bg-background text-left hover:bg-muted'"
    (click)="openAuth()"
  >
    <span>{{
      'XP.Xpert.Auth_' + (credentials().auth_type ?? 'none') | translate: { Default: credentials().auth_type ?? 'None' }
    }}</span
    ><z-icon zType="settings" aria-hidden="true" /></button
></label>
