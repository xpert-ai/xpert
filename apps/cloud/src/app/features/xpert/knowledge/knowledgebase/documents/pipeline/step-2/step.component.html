<xp-knowledge-document-pipeline-settings
  class="min-h-0 flex-1"
  [knowledgebase]="knowledgebase()"
  [pipeline]="pipeline()"
  [selectedSource]="selectedSource()"
  [taskId]="taskId()"
  [documents]="documents()"
  [(parametersValue)]="parametersValue"
>
  <footer actions xpDialogFooter class="justify-between">
    <button z-button zType="outline" type="button" [zDisabled]="loading()" (click)="previousStep()">
      <i class="ri-arrow-left-line" aria-hidden="true"></i>
      {{ 'XP.Knowledgebase.DocumentSource' | translate: { Default: 'Document Source' } }}
    </button>
    <button z-button type="button" [zDisabled]="loading()" [zLoading]="loading()" (click)="saveAndProcess()">
      {{ 'XP.Knowledgebase.SaveAndProcess' | translate: { Default: 'Save and Process' } }}
    </button>
  </footer>
</xp-knowledge-document-pipeline-settings>
