<div class="system-md-semibold relative flex items-center px-4 pb-2 pt-5 text-text-primary">
  <a class="cursor-pointer mr-2" (click)="backToDocuments()">
    <button
      type="button"
      class="btn disabled:btn-disabled btn-secondary-accent btn-medium size-9 rounded-full p-0 flex items-center justify-center"
    >
      <i class="ri-corner-up-left-line"></i>
    </button>
  </a>

  <div class="flex flex-col">
    <span
      class="text-sm font-semibold font-body bg-gradient-to-br from-[rgba(11,165,236,0.95)] to-[rgba(21,90,239,0.95)] bg-clip-text text-transparent"
    >
      {{ 'XP.Knowledgebase.DocumentsSettings' | translate: { Default: 'Document Settings' } }}
    </span>
    <span class="text-base font-medium text-text-secondary">
      {{ 'XP.Knowledgebase.ProcessDocuments' | translate: { Default: 'Process Documents' } }}
    </span>
  </div>

  <div class="absolute w-[100px] h-[100px] rounded-full bg-blue-500 blur-[80px] left-16 -top-10 opacity-30 z-0"></div>
</div>

@if (sourceConfig()) {
  <xp-knowledge-document-pipeline-settings
    class="flex-1 overflow-hidden"
    [knowledgebase]="knowledgebase()"
    [pipeline]="pipeline()"
    [documents]="documents()"
    [(parametersValue)]="parametersValue"
  >
    <div actions class="w-full flex items-center justify-end gap-2">
      <button
        z-button
        zType="outline"
        zSize="lg"
        type="button"
        [zDisabled]="processing() || !canRechunk()"
        [title]="
          canRechunk()
            ? ('XP.Knowledgebase.RechunkWithoutConverterHint'
              | translate: { Default: 'Reuse the saved conversion result without calling the converter.' })
            : ('XP.Knowledgebase.TransformSnapshotRequired'
              | translate: { Default: 'Run a full conversion once to create a reusable conversion snapshot.' })
        "
        (click)="saveAndProcess('rechunk')"
      >
        <i class="ri-scissors-cut-line mr-1"></i>
        {{ 'XP.Knowledgebase.RechunkOnly' | translate: { Default: 'Re-chunk Only' } }}
      </button>
      <button
        z-button
        zType="default"
        zSize="lg"
        type="button"
        [zDisabled]="processing()"
        (click)="saveAndProcess('full')"
      >
        {{ 'XP.Knowledgebase.FullReprocess' | translate: { Default: 'Convert and Process' } }}
      </button>
    </div>
  </xp-knowledge-document-pipeline-settings>
} @else if (document()) {
  <xp-knowledge-document-create-settings
    class="flex overflow-hidden"
    [(documents)]="documents"
    [(parserConfig)]="parserConfig"
  >
    <div inline-actions class="contents">
      <button
        z-button
        zType="outline"
        zSize="lg"
        type="button"
        [zDisabled]="processing() || !canRechunk()"
        [title]="
          canRechunk()
            ? ('XP.Knowledgebase.RechunkWithoutConverterHint'
              | translate: { Default: 'Reuse the saved conversion result without calling the converter.' })
            : ('XP.Knowledgebase.TransformSnapshotRequired'
              | translate: { Default: 'Run a full conversion once to create a reusable conversion snapshot.' })
        "
        (click)="processDocuments('rechunk')"
      >
        <i class="ri-scissors-cut-line mr-1"></i>
        {{ 'XP.Knowledgebase.RechunkOnly' | translate: { Default: 'Re-chunk Only' } }}
      </button>
      <button
        z-button
        zType="default"
        zSize="lg"
        type="button"
        [zDisabled]="processing()"
        (click)="processDocuments('full')"
      >
        {{ 'XP.Knowledgebase.FullReprocess' | translate: { Default: 'Convert and Process' } }}
      </button>
    </div>
  </xp-knowledge-document-create-settings>
}

@if (loading()) {
  <xp-spin class="absolute left-0 top-0 w-full h-full" />
}
