<h3 class="mb-4 text-lg">
  {{
    'XP.SHARED.AuthBottomSheet.Title'
      | translate: { Default: "Provide an account for '" + data.name + "'", name: data.name }
  }}
</h3>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col justify-start items-stretch">
  <xp-input [label]="'XP.KEY_WORDS.Username' | translate: { Default: 'Username' }" formControlName="username" />

  <xp-input
    [label]="'XP.KEY_WORDS.Password' | translate: { Default: 'Password' }"
    type="password"
    formControlName="password"
  />

  <!-- 目前没有意义，因为 Auth 必须保存到 Server 才能被使用
  <z-checkbox formControlName="remeberMe">
    {{ 'XP.KEY_WORDS.RemeberMe' | translate: {Default: 'Remeber Me'} }}
  </z-checkbox> -->

  <div class="flex justify-end items-center">
    <div xpButtonGroup displayDensity="cosy">
      <button z-button zType="secondary" type="button" displayDensity="cosy" (click)="onCancel()">
        {{ 'XP.KEY_WORDS.Cancel' | translate: { Default: 'Cancel' } }}
      </button>
      <button z-button zType="default" displayDensity="cosy">
        {{ 'XP.KEY_WORDS.Confirm' | translate: { Default: 'Confirm' } }}
      </button>
    </div>
  </div>
</form>
