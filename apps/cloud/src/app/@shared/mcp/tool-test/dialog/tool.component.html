<section xpDialogLayout="wide" class="w-[min(720px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
    <h2 xpDialogHeading>{{ tool().name | i18n }}</h2>
    <button
      z-button
      zType="ghost"
      type="button"
      xpDialogCloseButton
      zSize="icon"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="cancel()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody><mcp-toolset-tool-test class="block min-w-0" [tool]="tool()" visibleAll /></div>
  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" (click)="cancel()">
      {{ 'XP.ACTIONS.Close' | translate: { Default: 'Close' } }}
    </button>
  </footer>
</section>
