<section xpDialogLayout="wide" xpDialogPurpose="workflow" class="w-[min(680px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader>
    <h2 xpDialogHeading>{{ 'XP.Project.Files' | translate: { Default: 'Files' } }}</h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [zDisabled]="loading()"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="close()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody>
    <xp-upload
      class="w-full min-h-72"
      [files]="fileList"
      (filesChange)="onFileListChange($event)"
      (removeFileChange)="removeFiles($event)"
    />
  </div>
  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" [zDisabled]="loading()" (click)="close()">
      {{ 'XP.ACTIONS.Cancel' | translate: { Default: 'Cancel' } }}</button
    ><button
      z-button
      zType="default"
      type="button"
      [zDisabled]="loading() || !fileList.length"
      [zLoading]="loading()"
      (click)="upload()"
    >
      <z-icon zType="upload" aria-hidden="true" />{{ 'Story.Common.Upload' | translate: { Default: 'Upload' } }}
    </button>
  </footer>
</section>
