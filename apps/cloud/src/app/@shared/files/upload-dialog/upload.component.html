<div
  class="w-[300px] shrink-0 flex flex-col justify-start overflow-auto bg-components-panel-bg text-text-primary p-4 group"
>
  <div class="w-full flex justify-start items-center mb-4" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
    <z-icon zSize="default" class="-ml-2 opacity-0 group-hover:opacity-80" zType="drag_indicator"></z-icon>
    <span class="text-lg pointer-events-none">
      {{ 'XP.Project.Files' | translate: { Default: 'Files' } }}
    </span>
  </div>

  <xp-search class="my-2" [formControl]="searchControl"></xp-search>

  <ul class="xp-nav-list flex-1 overflow-auto"></ul>

  <div class="flex justify-end items-center">
    <div xpButtonGroup>
      <button
        class="text-text-accent hover:text-text-accent"
        z-button
        zType="outline"
        xpAppearance="dashed"
        displayDensity="cosy"
        (click)="upload()"
      >
        <div class="flex justify-start items-center">
          <z-icon zType="upload"></z-icon>
          {{ 'Story.Common.Upload' | translate: { Default: 'Upload' } }}
        </div>
      </button>
    </div>
  </div>
</div>

<div class="flex-1 min-w-[300px] flex flex-col justify-center items-center overflow-hidden">
  <xp-upload
    class="w-full flex-1"
    [files]="fileList"
    (filesChange)="onFileListChange($event)"
    (removeFileChange)="removeFiles($event)"
  />
</div>
