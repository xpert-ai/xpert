<section xpDialogLayout="wide" class="w-[min(520px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
    <h2 xpDialogHeading>
      {{ 'XP.MENU.InviteUsers' | translate: { Default: 'Invite Users' } }}
    </h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="cancel()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>

  <div xpDialogBody>
    <xp-email-invite-form #emailInviteForm [invitationType]="invitationType" />
  </div>

  <footer xpDialogFooter>
    <button z-button zType="outline" cdkFocusInitial (click)="cancel()">
      {{ 'COMPONENTS.COMMON.CANCEL' | translate: { Default: 'Cancel' } }}
    </button>
    <button z-button zType="default" [zDisabled]="emailInviteForm.form.invalid" (click)="onApply()">
      {{ 'COMPONENTS.COMMON.APPLY' | translate: { Default: 'Apply' } }}
    </button>
  </footer>
</section>
