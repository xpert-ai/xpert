<form
  xpDialogLayout="wide"
  class="w-[min(520px,calc(100vw-32px))] max-h-[84dvh]"
  [formGroup]="formGroup"
  (ngSubmit)="apply()"
>
  <header xpDialogHeader>
    <h2 xpDialogHeading>{{ 'XP.KEY_WORDS.Tag' | translate: { Default: 'Tag' } }}</h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="close()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <label class="flex flex-col gap-2"
        ><span>{{ 'XP.KEY_WORDS.Name' | translate: { Default: 'Name' } }}</span
        ><input
          z-input
          class="w-full"
          formControlName="name"
          [placeholder]="'XP.KEY_WORDS.Tag' | translate: { Default: 'Tag' }"
      /></label>
      <label class="flex flex-col gap-2"
        ><span>{{ 'XP.KEY_WORDS.Category' | translate: { Default: 'Category' } }}</span
        ><z-select class="w-full" formControlName="category">
          @for (category of allCategories; track category) {
            <z-select-item [zValue]="category">{{ category }}</z-select-item>
          }
        </z-select></label
      >
    </div>
    <label class="flex flex-col gap-2"
      ><span>{{ 'XP.KEY_WORDS.Color' | translate: { Default: 'Color' } }}</span
      ><input z-input class="w-full" type="text" formControlName="color"
    /></label>
    <label class="flex flex-col gap-2"
      ><span>{{ 'XP.KEY_WORDS.Description' | translate: { Default: 'Description' } }}</span
      ><textarea z-input class="w-full" formControlName="description"></textarea>
    </label>
  </div>
  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" (click)="close()">
      {{ 'XP.ACTIONS.Cancel' | translate: { Default: 'Cancel' } }}</button
    ><button z-button type="submit" [zDisabled]="formGroup.invalid || formGroup.pristine">
      {{ 'XP.ACTIONS.Create' | translate: { Default: 'Create' } }}
    </button>
  </footer>
</form>
