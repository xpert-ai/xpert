<formly-form
  #formly
  class="flex-1 self-stretch"
  [form]="form"
  [fields]="schema"
  [model]="customSmtp"
  (modelChange)="onFormChange(customSmtp)"
>
</formly-form>

<div class="flex justify-start">
  <div class="flex items-center gap-1">
    <button
      class="text-text-accent hover:text-text-accent"
      z-button
      zType="outline"
      zSize="sm"
      [disabled]="isValidated()"
      (click)="validateSmtp()"
    >
      {{ 'XP.ACTIONS.Validate' | translate: { Default: 'Validate' } }}
    </button>

    <button
      z-button
      zType="default"
      zSize="sm"
      [disabled]="!isValidated() || form.invalid || form.pristine"
      (click)="onSubmit()"
    >
      {{ 'XP.ACTIONS.Save' | translate: { Default: 'Save' } }}
    </button>
  </div>
</div>
