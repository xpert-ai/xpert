<input
  [(ngModel)]="model"
  class="w-full xp-input-inline xp-input-sm hover:bg-hover-bg"
  [disabled]="disabled()"
  [ngClass]="{ error: nameError() }"
  [zTooltip]="'XP.Xpert.NameExistedOrInvalid' | translate: { Default: 'Name existed or invalid, use a-zA-Z0-9_-' }"
  [zDisabled]="!nameError()"
/>
