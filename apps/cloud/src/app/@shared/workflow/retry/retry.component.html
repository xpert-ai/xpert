<div class="flex items-center justify-between px-4 py-2 h-10">
  <div class="flex items-center">
    <div class="mr-0.5 system-sm-semibold-uppercase text-text-secondary">
      {{ 'XP.Xpert.RetryOnFailure' | translate: { Default: 'Retry on failure' } }}
    </div>
  </div>

  <z-switch [(ngModel)]="enabledRetry" />
</div>

@if (enabledRetry()) {
  <div class="mt-3 grid w-full min-w-0 grid-cols-[minmax(0,1fr)_minmax(0,200px)_3.5rem] items-center gap-3 px-4">
    <div class="min-w-0 truncate whitespace-nowrap text-sm">
      {{ 'XP.Xpert.StopAfterAttempt' | translate: { Default: 'Stop After Attempt' } }}
      <i
        class="ri-information-line opacity-20 hover:opacity-100"
        [zTooltip]="'XP.Xpert.StopAfterAttemptTip' | translate: { Default: 'How many times to try before stopping' }"
        zPosition="top"
      ></i>
    </div>

    <z-slider
      class="min-w-0 w-full"
      [min]="1"
      [max]="10"
      [showValueLabel]="true"
      [value]="stopAfterAttempt()"
      (changeEnd)="setStopAfterAttempt($event)"
    ></z-slider>

    <input
      class="xp-input !w-14 !max-w-14 block h-8 text-center text-[13px] text-gra-900"
      [min]="1"
      [max]="10"
      [step]="1"
      type="number"
      [ngModel]="stopAfterAttempt()"
      (ngModelChange)="stopAfterAttempt.set($event)"
    />
  </div>

  <div class="mt-2 grid w-full min-w-0 grid-cols-[minmax(0,1fr)_minmax(0,200px)_3.5rem] items-center gap-3 px-4">
    <div class="min-w-0 truncate whitespace-nowrap text-sm">
      {{ 'XP.Xpert.RetryInterval' | translate: { Default: 'Retry Interval' } }}
      <i
        class="ri-information-line opacity-20 hover:opacity-100"
        [zTooltip]="'XP.Xpert.RetryIntervalTip' | translate: { Default: 'How many seconds between retries?' }"
        zPosition="top"
      ></i>
    </div>

    <z-slider
      class="min-w-0 w-full"
      [min]="1"
      [max]="10"
      [showValueLabel]="true"
      [value]="retryInterval()"
      (changeEnd)="setRetryInterval($event)"
    ></z-slider>

    <input
      class="xp-input !w-14 !max-w-14 block h-8 text-center text-[13px] text-gra-900"
      [min]="1"
      [max]="10"
      [step]="1"
      type="number"
      [ngModel]="retryInterval()"
      (ngModelChange)="retryInterval.set($event)"
    />
  </div>
}
