<section xpDialogLayout="wide" class="w-[min(1040px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader>
    <h2 xpDialogHeading>{{ repository().name }}</h2>
    <p xpDialogDescription>
      {{ 'Pro.RepositoryReady' | translate: { Default: 'Ready' } }} · {{ repository().lastSyncAt | date: 'medium' }}
    </p>
    <button
      z-button
      zType="ghost"
      type="button"
      xpDialogCloseButton
      zSize="icon"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="close()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <z-segmented [(ngModel)]="mode"
        ><z-segmented-item
          value="incremental"
          [label]="'Pro.IndexModeIncremental' | translate: { Default: 'Incremental' }" /><z-segmented-item
          value="full"
          [label]="'Pro.IndexModeFull' | translate: { Default: 'Full' }"
      /></z-segmented>
      <div xpDialogActionGroup="inline" class="flex flex-wrap gap-2">
        @if (canUploadPackages) {
          <button
            z-button
            zType="outline"
            type="button"
            [zDisabled]="loading() || loadingIndexes()"
            (click)="openUploadDialog()"
          >
            <z-icon zType="upload" aria-hidden="true" />{{ 'XP.ACTIONS.Upload' | translate: { Default: 'Upload' } }}
          </button>
        }
        <button
          z-button
          zType="outline"
          type="button"
          [zDisabled]="loading() || loadingIndexes()"
          [zLoading]="loading()"
          (click)="reloadIndexes()"
        >
          <z-icon zType="refresh" aria-hidden="true" />{{
            'Pro.RefreshIndex' | translate: { Default: 'Refresh index' }
          }}
        </button>
      </div>
    </div>
    @if (loadingIndexes()) {
      <p role="status" class="flex items-center gap-2 text-muted-foreground">
        <z-icon zType="loader-circle" class="animate-spin" aria-hidden="true" />{{
          'XP.KEY_WORDS.Loading' | translate: { Default: 'Loading' }
        }}
      </p>
    }
    <xp-skill-indexes
      class="block min-w-0"
      [indexes]="indexes()"
      [selectedRepository]="repository()"
      [showInstallAction]="false"
    />
  </div>
  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" (click)="close()">
      {{ 'XP.ACTIONS.Close' | translate: { Default: 'Close' } }}
    </button>
  </footer>
</section>
