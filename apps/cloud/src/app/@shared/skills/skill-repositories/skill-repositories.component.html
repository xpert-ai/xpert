<div class="flex flex-col divide-y divide-border overflow-hidden rounded-lg border border-border">
  @for (repo of repositories(); track repo.id) {
    <div
      class="group relative flex flex-wrap items-center gap-3 px-4 py-3 text-left transition-colors hover:bg-muted/50"
      [ngClass]="repo.id === selectedRepositoryId() ? 'bg-muted/60' : 'bg-card'"
    >
      <button
        z-button
        zType="ghost"
        type="button"
        class="min-w-0 justify-start px-0"
        [attr.aria-pressed]="repo.id === selectedRepositoryId()"
        (click)="selectRepository(repo)"
      >
        <span
          class="h-2 w-2 rounded-full bg-current"
          [class.text-text-success]="!!repo.lastSyncAt"
          [class.text-text-warning]="!repo.lastSyncAt"
        ></span>
        {{ repo.name }}
        @if (isSystemManaged(repo)) {
          <span
            class="rounded-full border border-divider-regular bg-background-default-subtle px-2 py-0.5 text-[11px] font-medium text-text-secondary"
          >
            {{ 'XP.Skill.SystemManagedRepository' | translate: { Default: 'System' } }}
          </span>
        }
      </button>
      <div class="mt-1 flex flex-1 items-center gap-2 text-xs text-muted-foreground">
        @if (repo.lastSyncAt) {
          <span class="text-muted-foreground">•</span>
          <span>{{ 'Pro.Synced' | translate: { Default: 'Synced' } }} {{ repo.lastSyncAt | date: 'short' }}</span>
        }
      </div>

      @if (!readonlyMode()) {
        <div class="ml-auto flex items-center gap-1">
          @if (!isSystemManaged(repo)) {
            <button
              type="button"
              z-button
              zType="ghost"
              zSize="icon-sm"
              (click)="editRepository(repo, $event)"
              [attr.aria-label]="'XP.ACTIONS.Edit' | translate: { Default: 'Edit' }"
            >
              <i class="ri-pencil-line"></i>
            </button>

            <button
              type="button"
              z-button
              zType="ghost"
              zSize="icon-sm"
              [zDisabled]="savingRepo()"
              (click)="deleteRepository(repo, $event)"
              [attr.aria-label]="'XP.ACTIONS.Delete' | translate: { Default: 'Delete' }"
            >
              <i class="ri-delete-bin-line"></i>
            </button>
          }

          <button
            type="button"
            z-button
            zType="ghost"
            zSize="icon-sm"
            (click)="openRepository(repo, $event)"
            [attr.aria-label]="'XP.ACTIONS.Setting' | translate: { Default: 'Setting' }"
          >
            <i class="ri-settings-3-line"></i>
          </button>
        </div>
      }
    </div>
  }
</div>
