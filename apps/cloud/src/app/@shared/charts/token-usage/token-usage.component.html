<div class="flex justify-start gap-4 mb-4 flex-1">
  @for (group of groups(); track group.name) {
    <div class="p-1">
      <div class="text-3xl font-semibold text-text-secondary">
        {{ group.points | number: '1.0-10' }} {{ 'XP.Membership.PointsShort' | translate }}
      </div>
      <div class="text-sm text-text-tertiary">{{ group.name }}</div>
    </div>
  }
</div>

<div class="echarts h-80" echarts [options]="options()" theme="light"></div>
