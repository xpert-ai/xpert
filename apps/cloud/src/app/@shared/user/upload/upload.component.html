<section xpDialogLayout="wide" xpDialogPurpose="workflow" class="w-[min(840px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader>
    <h2 xpDialogHeading cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
      {{ 'XP.SHARED.User.CreateAccounts' | translate: { Default: 'Create Accounts' } }}
    </h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="close()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody class="relative">
    <z-stepper class="w-full" [selectedIndex]="step() - 1" (selectedIndexChange)="step.set($event + 1)">
      <z-step [label]="'Pro.UploadFiles' | translate: { Default: 'Upload files' }">
        <xp-upload
          class="min-h-64"
          [files]="fileList"
          (filesChange)="onFileListChange($event)"
          (removeFileChange)="removeFiles($event)"
        />
      </z-step>
      <z-step [label]="'XP.ACTIONS.Save' | translate: { Default: 'Save' }">
        <div class="min-w-0 overflow-x-auto">
          <xp-table
            class="flex-1"
            [data]="users()"
            [columns]="[
              {
                name: 'username',
                caption: ('XP.SHARED.USER_BASIC.Username' | translate: { Default: 'Username' })
              },
              {
                name: 'email',
                caption: ('XP.SHARED.USER_BASIC.Email' | translate: { Default: 'Email' })
              },
              {
                name: 'hash',
                caption: ('XP.SHARED.USER_BASIC.Passwrod' | translate: { Default: 'Passwrod' })
              },
              {
                name: 'firstName',
                caption: ('XP.SHARED.USER_BASIC.firstName' | translate: { Default: 'First Name' })
              },
              {
                name: 'lastName',
                caption: ('XP.SHARED.USER_BASIC.lastName' | translate: { Default: 'Last Name' })
              },
              {
                name: 'roleName',
                caption: ('XP.SHARED.USER_BASIC.Role' | translate: { Default: 'Role' })
              },
              {
                name: 'thirdPartyId',
                caption: ('XP.SHARED.USER_BASIC.ThirdPartyId' | translate: { Default: 'Third Party Id' })
              }
            ]"
          />
        </div>
      </z-step>
    </z-stepper>
    @if (loading()) {
      <xp-spin class="absolute inset-0" />
    }
  </div>
  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" (click)="close()">
      {{ 'XP.ACTIONS.Cancel' | translate: { Default: 'Cancel' } }}
    </button>
    @if (step() === 1) {
      <button z-button zType="outline" type="button" (click)="downloadTempl()">
        <z-icon zType="file_download" aria-hidden="true" />{{
          'XP.SHARED.User.DownloadTemplate' | translate: { Default: 'Download Template' }
        }}
      </button>
    } @else {
      <button z-button type="button" [zLoading]="loading()" [zDisabled]="loading() || !users().length" (click)="save()">
        <z-icon zType="save" aria-hidden="true" />{{ 'XP.ACTIONS.Save' | translate: { Default: 'Save' } }}
      </button>
    }
  </footer>
</section>
