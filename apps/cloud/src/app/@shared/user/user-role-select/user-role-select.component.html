<section xpDialogLayout="standard" class="w-[min(440px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader>
    <h2 xpDialogHeading>
      {{ 'XP.MENU.AddUsers' | translate: { Default: 'Add Users' } }}
    </h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="onCancel()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>

  <div xpDialogBody>
    <z-form-field appearance="fill" color="accent">
      <z-form-label>{{ 'XP.KEY_WORDS.Users' | translate: { Default: 'Users' } }}</z-form-label>
      <z-tag-select
        mode="multiple"
        [value]="users"
        [options]="(userOptions$ | async) ?? []"
        [enableSuggestions]="true"
        [searchable]="true"
        [compareWith]="compareUsers"
        [displayWith]="displayUser"
        [placeholder]="'XP.SHARED.User.NameEmail' | translate: { Default: 'Name,Email' }"
        [clearable]="!single"
        (valueChange)="onUsersChange($event)"
        (zSearchTermChange)="onSearchTermChange($event)"
      />
      @if (loading) {
        <div class="flex items-center justify-end pt-2">
          <z-loader diameter="20" />
        </div>
      }
    </z-form-field>

    @if (data?.roles) {
      <z-radio-group [(ngModel)]="role" displayDensity="cosy">
        @for (role of data.roles; track role.value) {
          <z-radio [value]="role.value">{{ role.label }}</z-radio>
        }
      </z-radio-group>
    }
  </div>

  <footer xpDialogFooter>
    <button z-button zType="outline" type="button" (click)="onCancel()">
      {{ 'COMPONENTS.COMMON.CANCEL' | translate: { Default: 'Cancel' } }}
    </button>
    <button z-button type="button" cdkFocusInitial (click)="onApply()">
      {{ 'COMPONENTS.COMMON.APPLY' | translate: { Default: 'Apply' } }}
    </button>
  </footer>
</section>
