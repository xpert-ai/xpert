<div [formGroup]="form" class="flex flex-col gap-5">
  @for (field of fields; track field.key) {
    <div>
      <label z-form-label [for]="'user-reset-' + field.key" zRequired class="mb-2 block text-sm">{{
        field.label | translate
      }}</label>
      <input
        z-input
        [id]="'user-reset-' + field.key"
        [formControlName]="field.key"
        type="password"
        autocomplete="new-password"
        required
        minlength="8"
        class="pointer-coarse:min-h-[44px]"
        (blur)="onTouched()"
        [zStatus]="errorFor(field.key) ? 'error' : undefined"
        [attr.aria-invalid]="!!errorFor(field.key)"
        [attr.aria-describedby]="
          errorFor(field.key)
            ? 'user-reset-' + field.key + '-error'
            : field.key === 'password'
              ? 'user-reset-hint'
              : null
        "
      />
      @if (errorFor(field.key); as error) {
        <p [id]="'user-reset-' + field.key + '-error'" class="mt-2 text-xs text-destructive" role="alert">
          {{ error | translate }}
        </p>
      } @else if (field.key === 'password') {
        <p id="user-reset-hint" class="mt-2 text-xs text-muted-foreground">
          {{ 'XP.PasswordSettings.MinLength' | translate }}
        </p>
      }
    </div>
  }
</div>
