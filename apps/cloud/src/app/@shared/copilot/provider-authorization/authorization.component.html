<section xpDialogLayout="wide" class="w-[min(520px,calc(100vw-32px))] max-h-[84dvh]">
  <header xpDialogHeader cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle>
    <h2 xpDialogHeading>{{ 'XP.Copilot.Setup' | translate: { Default: 'Setup' } }} {{ provider().label | i18n }}</h2>
    <button
      xpDialogCloseButton
      z-button
      zType="ghost"
      zSize="icon"
      type="button"
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="cancel()"
    >
      <z-icon zType="x" aria-hidden="true" />
    </button>
  </header>
  <div xpDialogBody>
    <div class="relative">
      <copilot-credential-form
        #credentialsForm
        [credentialFormSchemas]="credential_form_schemas()"
        [(ngModel)]="credentials"
      />
      @if (loading()) {
        <xp-spin class="absolute inset-0" />
      }
    </div>
    @if (error()) {
      <p role="alert" class="text-destructive">{{ error() }}</p>
    }
  </div>
  <footer xpDialogFooter>
    @if (help()) {
      <a
        class="mr-auto text-primary hover:underline"
        [href]="help().url | i18n"
        target="_blank"
        rel="noopener noreferrer"
        >{{ help().title | i18n }}</a
      >
    }
    <button z-button zType="outline" type="button" (click)="cancel()">
      {{ 'XP.ACTIONS.Cancel' | translate: { Default: 'Cancel' } }}</button
    ><button
      z-button
      zType="default"
      type="button"
      [zDisabled]="credentialsForm.invalid || loading() || !dirty()"
      [zLoading]="loading()"
      (click)="apply()"
    >
      {{ 'XP.ACTIONS.Save' | translate: { Default: 'Save' } }}
    </button>
  </footer>
</section>
