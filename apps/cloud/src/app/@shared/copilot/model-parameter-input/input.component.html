@if (parameter(); as parameter) {
  @switch (parameter.type) {
    @case (eParameterType.FLOAT) {
      <z-slider
        [disabledInput]="disabled()"
        class="w-[200px]"
        [min]="parameter.min"
        [max]="parameter.max"
        [step]="numericStep()"
        [showValueLabel]="true"
        [value]="numericValue()"
        (changeEnd)="updateValue($event)"
      ></z-slider>

      <input
        z-input
        [disabled]="disabled()"
        class="ml-4 block w-24 shrink-0"
        [max]="parameter.max"
        [min]="parameter.min"
        [step]="numericStep()"
        type="number"
        [ngModel]="value$()"
        (ngModelChange)="updateNumericValue($event, eParameterType.FLOAT)"
        [ngModelOptions]="{ standalone: true, updateOn: 'blur' }"
        (keydown)="$event.key !== 'Escape' && $event.stopPropagation()"
      />
    }
    @case (eParameterType.INT) {
      <z-slider
        [disabledInput]="disabled()"
        class="w-[200px]"
        [min]="parameter.min"
        [max]="sliderMaximum()"
        [showValueLabel]="true"
        [value]="numericValue()"
        (changeEnd)="updateValue($event)"
      ></z-slider>

      <input
        z-input
        [disabled]="disabled()"
        class="ml-4 block w-24 shrink-0"
        [max]="sliderMaximum()"
        [min]="parameter.min"
        [step]="1"
        type="number"
        [ngModel]="value$()"
        (ngModelChange)="updateNumericValue($event, eParameterType.INT)"
        [ngModelOptions]="{ standalone: true, updateOn: 'blur' }"
        (keydown)="$event.key !== 'Escape' && $event.stopPropagation()"
      />
    }

    @case (eParameterType.BOOLEAN) {
      <z-switch
        [disabled]="disabled()"
        [ngModel]="value$()"
        (ngModelChange)="updateValue($event)"
        [ngModelOptions]="{ standalone: true }"
        zSize="sm"
      />
    }

    @default {
      @if (parameter.options) {
        <z-select
          [zDisabled]="disabled()"
          class="w-36"
          [ngModel]="value$()"
          (ngModelChange)="updateValue($event)"
          [ngModelOptions]="{ standalone: true }"
        >
          @for (option of parameter.options; track option) {
            <z-select-item [zValue]="option">{{ option }}</z-select-item>
          }
        </z-select>
      } @else {
        <input
          z-input
          [disabled]="disabled()"
          class="ml-4 w-full"
          [ngModel]="value$()"
          (ngModelChange)="updateValue($event)"
          [ngModelOptions]="{ standalone: true }"
        />
      }
    }
  }
}
