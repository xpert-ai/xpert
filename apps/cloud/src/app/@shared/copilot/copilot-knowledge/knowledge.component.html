<div class="flex-1 mx-auto max-w-2xl">
  <form class="flex flex-wrap gap-4 p-4" [formGroup]="formGroup">
    <!-- <xp-select class="flex-1" [label]="'XP.Copilot.ExpertRole' | translate: {Default: 'Expert Role'}" valueKey="key" [displayBehaviour]="DisplayBehaviour.descriptionOnly"
      formControlName="role"
      [selectOptions]="roles()"
    /> -->

    <xp-input
      class="w-1/2"
      [label]="'XP.Copilot.Examples.Command' | translate: { Default: 'Command' }"
      valueKey="key"
      formControlName="command"
      [options]="commandOptions()"
    />

    <div class="flex-1 min-w-full flex flex-col">
      <label class="xp-input-label shrink-0">{{ 'XP.Copilot.Examples.Input' | translate: { Default: 'Input' } }}</label>
      <textarea
        class="xp-input-element"
        z-input
        formControlName="input"
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="5"
      >
      </textarea>
    </div>

    <div class="flex-1 min-w-full flex flex-col">
      <label class="xp-input-label shrink-0">{{
        'XP.Copilot.Examples.Output' | translate: { Default: 'Output' }
      }}</label>
      <textarea
        class="xp-input-element"
        z-input
        formControlName="output"
        cdkTextareaAutosize
        cdkAutosizeMinRows="2"
        cdkAutosizeMaxRows="8"
      ></textarea>
    </div>
  </form>
</div>

<div class="w-full sticky bottom-0 bg-background-default-subtle">
  <div class="flex justify-between items-center p-4 mx-auto max-w-2xl">
    <div></div>
    <div xpButtonGroup>
      <button z-button zType="ghost" (click)="close()">
        {{ 'XP.KEY_WORDS.Cancel' | translate: { Default: 'Cancel' } }}
      </button>
      <button
        z-button
        zType="default"
        [disabled]="loading() || formGroup.invalid || formGroup.pristine"
        (click)="upsert()"
      >
        {{ 'XP.KEY_WORDS.Save' | translate: { Default: 'Save' } }}
      </button>
    </div>
  </div>
</div>

@if (loading()) {
  <xp-spin class="absolute left-0 top-0 w-full h-full flex justify-center items-center"></xp-spin>
}
