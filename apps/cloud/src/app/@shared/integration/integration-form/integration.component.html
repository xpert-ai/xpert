<form [formGroup]="formGroup" class="w-full min-w-0 flex flex-col gap-4">
  <emoji-avatar formControlName="avatar" large editable class="self-center rounded-xl overflow-hidden shadow-lg" />

  <label class="flex flex-col gap-2"
    ><span class="font-medium">{{ 'XP.KEY_WORDS.Name' | translate: { Default: 'Name' } }}</span
    ><input z-input class="w-full" formControlName="name"
  /></label>

  <div class="flex flex-col gap-2">
    <label class="font-medium">{{ 'XP.KEY_WORDS.Description' | translate: { Default: 'Description' } }}</label>
    <textarea
      class="w-full"
      z-input
      formControlName="description"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="5"
    >
    </textarea>
  </div>

  @if (schema(); as fields) {
    <formly-form [form]="optionsForm" [options]="formOptions" [fields]="fields" [model]="optionsModel" />
  } @else if (integrationProvider()) {
    <list-content-loader />
  }

  @if (webhookUrl()) {
    <div>
      <p>{{ 'XP.Integration.WebhookUrl' | translate: { Default: 'Webhook url' } }}:</p>
      <pre class="px-2 py-1 rounded-md text-sm whitespace-break-spaces break-all bg-background-default-subtle">{{
        webhookUrl()
      }}</pre>
    </div>
  }

  <div xpDialogActionGroup="inline" class="flex justify-start">
    <button type="button" z-button zType="outline" [zDisabled]="loading()" [zLoading]="loading()" (click)="test()">
      {{ 'XP.KEY_WORDS.Test' | translate: { Default: 'Test' } }}
    </button>
  </div>
</form>

@if (loading()) {
  <xp-spin class="absolute left-0 top-0 w-full h-full" />
}
