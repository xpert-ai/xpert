<section xpDialogLayout="wide" class="w-[960px] max-w-full max-h-[calc(100dvh-32px)]">
  <header xpDialogHeader>
    <h2 xpDialogHeading>{{ 'XP.Chat.AllFilesInTask' | translate: { Default: 'All Files in Task' } }}</h2>
    <button
      type="button"
      z-button
      zType="ghost"
      zSize="icon"
      xpDialogCloseButton
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="close()"
    >
      <z-icon zType="x" />
    </button>
  </header>
  <div xpDialogBody>
    <chat-file-list class="block min-w-0" [projectId]="projectId()" [conversationId]="conversationId()" />
  </div>
  <footer xpDialogFooter>
    <button type="button" z-button zType="outline" (click)="close()">
      {{ 'XP.ACTIONS.Close' | translate: { Default: 'Close' } }}
    </button>
  </footer>
</section>
