<section xpDialogLayout="standard" class="w-[640px] max-w-full max-h-[calc(100dvh-32px)]">
  <header xpDialogHeader>
    <h2 xpDialogHeading>{{ 'XP.Chat.AllFilesInTask' | translate: { Default: 'All Files in Task' } }}</h2>
    <button
      type="button"
      z-button
      zType="ghost"
      zSize="icon"
      xpDialogCloseButton
      [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
      (click)="close()"
    >
      <z-icon zType="x" />
    </button>
  </header>
  <div xpDialogBody>
    <div class="divide-y divide-border">
      @for (item of files(); track item.filePath) {
        <div class="flex min-w-0 items-center gap-3 py-3">
          <z-icon zType="file" class="shrink-0 text-muted-foreground" />
          <div class="min-w-0 flex-1">
            <p class="break-all">{{ item.filePath }}</p>
            <p class="text-xs text-muted-foreground">{{ item.createdAt | relative }}</p>
          </div>
          <div xpDialogActionGroup="inline">
            <button
              type="button"
              z-button
              zType="ghost"
              zSize="icon"
              [cdkMenuTriggerFor]="fileMenu"
              [cdkMenuTriggerData]="{ file: item }"
              [attr.aria-label]="'XP.KEY_WORDS.More' | translate: { Default: 'More actions' }"
            >
              <z-icon zType="ellipsis" />
            </button>
          </div>
        </div>
      } @empty {
        <p class="py-6 text-center text-muted-foreground">
          {{ 'XP.Files.NoFilesFound' | translate: { Default: 'No files' } }}
        </p>
      }
    </div>
  </div>
  <footer xpDialogFooter>
    <button type="button" z-button zType="outline" (click)="close()">
      {{ 'XP.ACTIONS.Close' | translate: { Default: 'Close' } }}
    </button>
  </footer>
  <ng-template #fileMenu let-file="file"
    ><div cdkMenu class="cdk-menu__medium">
      <button cdkMenuItem (click)="preview(file)">
        <z-icon zType="eye" />{{ 'XP.KEY_WORDS.Preview' | translate: { Default: 'Preview' } }}
      </button>
      <button cdkMenuItem (click)="download(file)">
        <z-icon zType="file_download" />{{ 'XP.KEY_WORDS.Download' | translate: { Default: 'Download' } }}
      </button>
    </div></ng-template
  >
</section>
