@if (isImage() && (uploadedUrl() || previewUrl())) {
  <figure
    class="img-figure relative flex-shrink-0 aspect-square overflow-hidden ms-0 me-0 rounded-[9px]"
    (click)="openImage()"
  >
    @if (uploadedUrl()) {
      <img class="h-full mx-auto object-cover" [src]="uploadedUrl()" [alt]="name()" />
    } @else {
      <img class="h-full mx-auto object-cover" [src]="previewUrl()" [alt]="name()" />
    }
  </figure>
} @else {
  <xp-file-icon [fileType]="name() | fileType" small class="opacity-80 group-hover/chip:opacity-100" />
  <span class="truncate max-w-full me-auto sm:max-w-full flex-1 mr-2">
    {{ name() }}
  </span>
}

@if (editable()) {
  <button
    type="button"
    class="absolute -top-1 -right-1 btn inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium leading-[normal] cursor-pointer focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:opacity-60 disabled:cursor-default transition-colors duration-100 disabled:hover:text-secondary disabled:hover:bg-inherit h-6 w-6 rounded-full ml-1 p-0.5 flex-shrink-0 danger opacity-0 group-hover/chip:opacity-100"
    (click)="delete()"
  >
    <i class="ri-close-line"></i>
  </button>
}

@if (!storageFile() && progress() !== 100) {
  <xp-progress-spinner
    class="absolute top-0 left-0 w-12 h-12 flex justify-center items-center p-2 text-orange-600 dark:text-orange-500"
    [value]="progress()"
  />
}

<ng-template #dialog>
  <div xpDialogLayout="wide" class="w-[900px] max-w-full max-h-[85dvh]">
    <header xpDialogHeader>
      <h2 xpDialogHeading>{{ name() }}</h2>
      <button
        type="button"
        z-button
        zType="ghost"
        zSize="icon"
        xpDialogCloseButton
        [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
        (click)="closeImage()"
      >
        <z-icon zType="x" />
      </button>
    </header>
    <div xpDialogBody>
      <button
        type="button"
        class="block w-full cursor-zoom-out focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
        [attr.aria-label]="'XP.ACTIONS.Close' | translate: { Default: 'Close' }"
        (click)="closeImage()"
      >
        <img
          class="mx-auto max-h-[65dvh] max-w-full object-contain"
          [src]="uploadedUrl() || previewUrl()"
          [alt]="name()"
        />
      </button>
    </div>
    <footer xpDialogFooter>
      <button type="button" z-button zType="outline" (click)="closeImage()">
        {{ 'XP.ACTIONS.Close' | translate: { Default: 'Close' } }}
      </button>
    </footer>
  </div></ng-template
>
