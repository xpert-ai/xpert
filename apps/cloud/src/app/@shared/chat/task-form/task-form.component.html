<form [formGroup]="formGroup" class="">
  <div class="mb-2">
    <label class="font-medium my-2 inline-block">
      {{ 'XP.Xpert.Name' | translate: { Default: 'Name' } }}
    </label>
    <div class="relative w-full">
      <input
        z-input
        class="w-full grow h-10"
        [placeholder]="'XP.Xpert.TaskName' | translate: { Default: 'Name' }"
        formControlName="name"
      />
    </div>
  </div>

  <div class="mb-2">
    <label class="font-medium my-2 inline-block">
      {{ 'XP.Chat.Agent' | translate: { Default: 'Agent' } }}
    </label>
    <div class="relative w-full">
      <input
        z-input
        class="w-full grow h-10"
        [placeholder]="'XP.Chat.Agent' | translate: { Default: 'Agent' }"
        formControlName="agentKey"
      />
    </div>
  </div>

  <div class="mb-2">
    <label class="font-medium my-2 inline-block">
      {{ 'XP.Xpert.Instructions' | translate: { Default: 'Instructions' } }}
    </label>
    <div class="relative w-full">
      <textarea
        z-input
        class="w-full grow h-10"
        [placeholder]="'XP.Xpert.Instructions' | translate: { Default: 'Instructions' }"
        formControlName="prompt"
        cdkTextareaAutosize
        cdkAutosizeMinRows="2"
        cdkAutosizeMaxRows="5"
      ></textarea>
    </div>
  </div>

  <div class="mb-2">
    <label class="font-medium my-2 inline-block">
      {{ 'XP.Xpert.Schedule' | translate: { Default: 'Schedule' } }}
    </label>
    <div class="relative w-full">
      <input
        z-input
        class="w-full grow h-10"
        [placeholder]="'XP.Xpert.Schedule' | translate: { Default: 'Schedule' }"
        formControlName="schedule"
      />
    </div>
  </div>
</form>
