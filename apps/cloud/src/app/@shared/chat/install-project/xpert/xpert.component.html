<div xpDialogActionGroup="inline" class="flex flex-wrap items-start justify-between gap-3">
  <div class="min-w-0 flex-1 space-y-2">
    <div class="flex flex-wrap items-center gap-2">
      <span class="font-semibold text-base truncate">{{ title() || name() }}</span>
      <span class="mx-2">
        {{ 'XP.XProject.Or' | translate: { Default: 'or' } }}
      </span>

      <button
        type="button"
        z-button
        zType="outline"
        class="max-w-full"
        [zDisabled]="!project() || loading() || createdXpert()"
        [cdkMenuTriggerFor]="xpertsMenu"
      >
        <i class="ri-links-line"></i>
        @if (bindedXpert()) {
          <span class="truncate">
            {{ bindedXpert().title || bindedXpert().name }}
          </span>
        } @else {
          <span>
            {{ 'XP.XProject.IntroduceExistExpert' | translate: { Default: 'Introduce Exist Expert' } }}
          </span>
        }
      </button>
      @if (bindedXpert()) {
        <button
          type="button"
          z-button
          zType="ghost"
          zSize="icon"
          [zDisabled]="!project() || loading() || !!createdXpert()"
          [attr.aria-label]="'XP.ACTIONS.Remove' | translate: { Default: 'Remove' }"
          (click)="removeBindedXpert()"
        >
          <z-icon zType="x" />
        </button>
      }
      @if (createdXpert()) {
        <i
          class="ri-checkbox-circle-fill ml-1 text-text-success"
          [zTooltip]="'XP.XProject.HaveImported' | translate: { Default: 'Imported' }"
          zPosition="top"
        ></i>
      }
    </div>
    <div class="text-sm text-text-secondary font-body line-clamp-2 whitespace-pre-line truncate mt-2">
      {{ description() }}
    </div>
  </div>

  <button
    type="button"
    z-button
    zType="outline"
    [zLoading]="loading()"
    [zDisabled]="loading() || createdXpert() || !project()?.workspaceId"
    (click)="importXpert()"
  >
    @if (bindedXpert()) {
      {{ 'XP.XProject.Binding' | translate: { Default: 'Binding' } }}
    } @else {
      {{ 'XP.XProject.Import' | translate: { Default: 'Import' } }}
    }
  </button>
</div>

<ng-template #xpertsMenu>
  <div cdkMenu class="cdk-menu__large max-w-sm text-text-primary relative p-0">
    <div class="w-full sticky -top-1 z-10 bg-components-card-bg">
      <z-search-input
        class="w-full"
        [formControl]="searchControl"
        [placeholder]="'XP.KEY_WORDS.Search' | translate: { Default: 'Search' }"
        [clearLabel]="'XP.ACTIONS.Clear' | translate: { Default: 'Clear search' }"
      />
    </div>

    @for (item of allXperts(); track item.id) {
      <button class="xp-cdk-menu-item p-1" cdkMenuItem (click)="bindExpert(item)">
        <emoji-avatar [avatar]="item.avatar" xs class="shrink-0 rounded-lg overflow-hidden shadow-sm mr-1" />
        <p class="overflow-hidden whitespace-nowrap text-ellipsis">{{ item.title || item.name }}</p>
      </button>
    } @empty {
      <div class="p-2 text-text-secondary">
        {{ 'XP.XProject.NoExperts' | translate: { Default: 'No experts found' } }}
      </div>
    }
  </div>
</ng-template>
