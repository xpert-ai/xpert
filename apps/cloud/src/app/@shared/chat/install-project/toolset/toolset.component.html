<div xpDialogActionGroup="inline" class="flex flex-wrap items-start justify-between gap-3">
  <div class="min-w-0 flex-1 space-y-2">
    <div class="flex flex-wrap items-center gap-2">
      <span class="font-semibold text-base truncate">{{ name() }}</span>
      <span class="mx-2">
        {{ 'XP.XProject.Or' | translate: { Default: 'or' } }}
      </span>

      <button
        type="button"
        z-button
        zType="outline"
        class="max-w-full"
        [zDisabled]="!project() || loading() || createdToolset()"
        [cdkMenuTriggerFor]="toolsMenu"
      >
        <i class="ri-links-line"></i>
        @if (bindedToolset()) {
          <span class="truncate">
            {{ bindedToolset().name }}
          </span>
        } @else {
          <span>
            {{ 'XP.XProject.IntroduceExistToolset' | translate: { Default: 'Introduce Exist Toolset' } }}
          </span>
        }
      </button>
      @if (bindedToolset()) {
        <button
          type="button"
          z-button
          zType="ghost"
          zSize="icon"
          [zDisabled]="!project() || loading() || !!createdToolset()"
          [attr.aria-label]="'XP.ACTIONS.Remove' | translate: { Default: 'Remove' }"
          (click)="removeBindedToolset()"
        >
          <z-icon zType="x" />
        </button>
      }
      @if (createdToolset()) {
        <i
          class="ri-checkbox-circle-fill ml-1 text-text-success"
          [zTooltip]="'XP.XProject.HaveImported' | translate: { Default: 'Imported' }"
          zPosition="top"
        ></i>
      }
    </div>
    <div class="text-sm text-text-secondary font-body line-clamp-2 whitespace-pre-line truncate mt-2">
      {{ description() }}
    </div>
  </div>

  <button
    type="button"
    z-button
    zType="outline"
    [zLoading]="loading()"
    [zDisabled]="loading() || createdToolset() || !project()?.workspaceId"
    (click)="importToolset()"
  >
    @if (bindedToolset()) {
      {{ 'XP.XProject.Binding' | translate: { Default: 'Binding' } }}
    } @else {
      {{ 'XP.XProject.Import' | translate: { Default: 'Import' } }}
    }
  </button>
</div>

<ng-template #toolsMenu>
  <div cdkMenu class="cdk-menu__large max-w-sm text-text-primary relative p-0">
    @for (toolset of toolsets(); track toolset.id) {
      <button class="xp-cdk-menu-item p-1" cdkMenuItem (click)="bindToolset(toolset)">
        <emoji-avatar small [avatar]="toolset.avatar" class="mr-1 shrink-0 rounded-lg overflow-hidden shadow-sm" />
        <span class="truncate">{{ toolset.name }}</span>
      </button>
    } @empty {
      <div class="p-2 text-text-secondary">
        {{ 'XP.XProject.NoToolset' | translate: { Default: 'No toolset found' } }}
      </div>
    }
  </div>
</ng-template>
