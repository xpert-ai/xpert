include:
  - ./docker/docker-compose.infra.yml

services:
  api:
    image: ${XPERT_API_IMAGE:-xpert-api:latest}
    deploy:
      replicas: ${API_REPLICAS:-1}
    build:
      context: .
      dockerfile: .deploy/api/Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
        CLIENT_BASE_URL: ${CLIENT_BASE_URL:-http://localhost:4200}
    environment: &api-environment
      # HOST: ${API_HOST:-api}
      # PORT: ${API_PORT:-3000}
      IS_DOCKER: true
      NODE_OPTIONS: '--max-old-space-size=8192'
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_SCHEMA_SYNC_MODE: external
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLAP_HOST: olap
      OLAP_PORT: 8080
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NPM_CONFIG_CACHE: /var/lib/xpert/data/npm-cache
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.cjs']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    entrypoint: './entrypoint.compose.sh'
    command: ['pm2-runtime', 'main.js']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      schema-sync:
        condition: service_completed_successfully
    links:
      - db:${DB_HOST:-db}
    expose:
      - '3000'
    volumes: &api-volumes
      - ./docker/volumes/api/public:/srv/xpert/public
      - ./docker/volumes/api/sandbox/:/sandbox/
      - ./docker/volumes/api/plugins:/srv/xpert/plugins
      - ./docker/volumes/api/data/:/var/lib/xpert/data/
    networks:
      - overlay

  schema-sync:
    image: ${XPERT_API_IMAGE:-xpert-api:latest}
    # Plugin discovery must see the same packages and configuration as the API.
    environment: *api-environment
    volumes: *api-volumes
    env_file:
      - .env
    entrypoint: './entrypoint.compose.sh'
    command: ['node', 'main.js', '--command', 'schema-sync']
    restart: 'no'
    depends_on:
      - db
      - redis
    networks:
      - overlay

  webapp:
    image: xpert-webapp:latest
    build:
      context: .
      dockerfile: .deploy/webapp/Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    environment:
      HOST: ${WEB_HOST:-webapp}
      NODE_ENV: ${NODE_ENV:-development}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      VITE_CHATKIT_FRAME_URL: ${VITE_CHATKIT_FRAME_URL:-/chatkit}
      VITE_MCP_APP_SANDBOX_PROXY_URL: ${VITE_MCP_APP_SANDBOX_PROXY_URL:-}
      VITE_MCP_APP_SANDBOX_ALLOWED_DOMAINS: ${VITE_MCP_APP_SANDBOX_ALLOWED_DOMAINS:-}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:-http://localhost:4200}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEFAULT_LATITUDE: ${DEFAULT_LATITUDE:-42.6459136}
      DEFAULT_LONGITUDE: ${DEFAULT_LONGITUDE:-23.3332736}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      API_HOST: api
      API_PORT: 3000
    entrypoint: './entrypoint.compose.sh'
    command: ['nginx', '-g', 'daemon off;']
    env_file:
      - .env
    restart: on-failure
    links:
      - api:${API_HOST:-api}
    depends_on:
      - api
    ports:
      - ${WEB_PORT:-80}:80
      - ${API_PORT:-3000}:3000
      # - 443:443
    volumes:
      - ./.deploy/webapp/nginx.compose.conf:/etc/nginx/conf.d/compose.conf.template:ro
      - ./docker/volumes/webapp/:/webapp/
    networks:
      - overlay
