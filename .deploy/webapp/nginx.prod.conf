user  nginx;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  #gzip  on;

  server {
    listen              80;

    location ~* \.(gif|jpg|jpeg|png|css|js|ico)$ {
      root /srv/xpert/;
    }

    # Entry HTML must revalidate when the hosted page is upgraded independently.
    location = /index.html {
      root /srv/xpert;
      add_header Cache-Control "no-cache" always;
    }

    # Missing pet files must return 404, never the Cloud SPA HTML.
    location ^~ /pets/ {
      root /srv/xpert;
      try_files $uri =404;
    }

    location = /chatkit {
      add_header Cache-Control "no-cache" always;
      root /srv/xpert;
      try_files /chatkit/index.html =404;
    }

    location /chatkit/assets/ {
      root /srv/xpert;
      try_files $uri =404;
    }

    location /chatkit/ {
      add_header Cache-Control "no-cache" always;
      root /srv/xpert;
      try_files $uri $uri/ /chatkit/index.html;
    }

    location / {
      root /srv/xpert;
      try_files $uri $uri/ /index.html;
    }
  }

}
