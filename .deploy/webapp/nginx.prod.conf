user  nginx;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  # Share URLs contain bearer credentials. Redact the token and query string
  # in both the request URI and Referer, retaining the route for diagnostics.
  map $request_uri $access_log_uri {
    default $request_uri;
    ~*^(?<share_log_prefix>/(?:s|artifacts/(?:snapshot|view|share|auth)|api/artifacts/shared-links|api/ai/shared-conversations))/[^/?]+(?<share_log_suffix>/[^?]*)?(?:\?.*)?$ $share_log_prefix/[REDACTED]$share_log_suffix;
  }
  map $http_referer $access_log_referer {
    default $http_referer;
    '' '-';
    ~*^(?<share_referer_prefix>(?:https?://[^/]+)?/(?:s|artifacts/(?:snapshot|view|share|auth)|api/artifacts/shared-links|api/ai/shared-conversations))/[^/?\#]+(?<share_referer_suffix>/[^?\#]*)?(?:[?\#].*)?$ $share_referer_prefix/[REDACTED]$share_referer_suffix;
  }

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $access_log_uri $server_protocol" '
                      '$status $body_bytes_sent "$access_log_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_time=$request_time upstream_response_time=$upstream_response_time';
  access_log  /var/log/nginx/access.log  main;

  #gzip  on;

  server {
    listen              80;

    # HTML/manifest identify one build. Runtime-substituted JS must revalidate;
    # a missing bundle is an error, never a successful SPA fallback.
    location = /version.json {
      root /srv/xpert;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location ^~ /s/ {
      root /srv/xpert;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      add_header Referrer-Policy "no-referrer" always;
      try_files /index.html =404;
    }

    location ^~ /artifacts/snapshot/ {
      root /srv/xpert;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      add_header Referrer-Policy "no-referrer" always;
      try_files /index.html =404;
    }

    location = /ngsw.json {
      add_header Cache-Control "no-store" always;
      return 404;
    }

    location = /ngsw-worker.js {
      root /srv/xpert;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location ~* \.(js|mjs|css)$ {
      root /srv/xpert;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location ~* \.(gif|jpg|jpeg|png|ico)$ {
      root /srv/xpert;
      try_files $uri =404;
    }

    # Entry HTML must never be reused without loading the deployed build.
    location = /index.html {
      root /srv/xpert;
      add_header Cache-Control "no-store" always;
    }

    # Missing pet files must return 404, never the Cloud SPA HTML.
    location ^~ /pets/ {
      root /srv/xpert;
      try_files $uri =404;
    }

    location = /chatkit {
      add_header Cache-Control "no-store" always;
      root /srv/xpert;
      try_files /chatkit/index.html =404;
    }

    location /chatkit/assets/ {
      root /srv/xpert;
      try_files $uri =404;
    }

    location /chatkit/ {
      add_header Cache-Control "no-store" always;
      root /srv/xpert;
      try_files $uri $uri/ /chatkit/index.html;
    }

    location / {
      add_header Cache-Control "no-store" always;
      root /srv/xpert;
      try_files $uri $uri/ /index.html;
    }
  }

}
