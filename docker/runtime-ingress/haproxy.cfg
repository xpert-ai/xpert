# Readiness withdrawal: fall=1, 1s probes/timeouts, and 5s API propagation grace.
# Existing SSE/WebSocket streams survive removal; never replay application requests.
global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option http-server-close
    timeout connect 1s
    timeout check 1s
    timeout client 10m
    timeout server 10m
    timeout tunnel 1h
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s
    accepted_payload_size 8192

frontend api
    bind :3000
    default_backend runtime
    # If every runtime is fenced, retain only the server's authenticated recovery routes.
    acl no_ready nbsrv(runtime) eq 0
    acl get method GET
    acl post method POST
    acl put method PUT
    acl recovery_get path /api/plugin /api/system/runtime/restart-capability
    acl recovery_status path_reg ^/api/system/runtime/(restart/[A-Za-z0-9_-]+|plugin-convergence/[0-9]+)$
    acl recovery_post path /api/auth/login /api/plugin /api/plugin/by-names /api/plugin/configuration /api/plugin/refresh /api/system/runtime/restart
    acl recovery_put path /api/plugin/configuration
    http-request set-var(txn.recovery) bool(true) if get recovery_get
    http-request set-var(txn.recovery) bool(true) if get recovery_status
    http-request set-var(txn.recovery) bool(true) if post recovery_post
    http-request set-var(txn.recovery) bool(true) if put recovery_put
    http-request return status 503 content-type application/json hdr Retry-After 5 hdr Cache-Control no-store string '{"statusCode":503,"errorCode":"RUNTIME_NOT_READY","message":"The API instance is not ready"}' if no_ready !{ var(txn.recovery) -m bool }
    use_backend recovery if no_ready { var(txn.recovery) -m bool }

backend runtime
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health/ready ver HTTP/1.1 hdr Host api
    http-check expect status 200
    server-template api 1-32 api:3000 check inter 1s fastinter 1s downinter 1s fall 1 rise 3 resolvers docker init-addr none init-state fully-down

backend recovery
    balance roundrobin
    server-template api 1-32 api:3000 check inter 1s fall 1 rise 1 resolvers docker init-addr none init-state fully-down
