packages:
  - 'apps/*'
  - 'libs/*'
  - 'packages/*'
  - 'packages/plugins/*'
  - 'docs'
  - 'legacies/*'

# Cloud, Desktop, API source and Docker stages share one ChatKit release.
catalog:
  '@xpert-ai/chatkit-angular': 0.11.2
  '@xpert-ai/chatkit-types': 0.11.2
  '@xpert-ai/chatkit-ui': 0.11.2
  '@xpert-ai/chatkit-web-component': 0.11.2
  '@xpert-ai/chatkit-web-shared': 0.11.2

# Keep overrides here so replacing the root manifest in Docker preserves them.
overrides:
  '@xpert-ai/plugin-sdk': workspace:*
  '@langchain/core': 0.3.72
  langchain: 0.3.31
  '@modelcontextprotocol/sdk': 1.12.1
  '@modelcontextprotocol/core>zod': 4.2.0
  '@modelcontextprotocol/server>zod': 4.2.0
  '@modelcontextprotocol/ext-apps>@modelcontextprotocol/sdk': 1.29.0
  '@xpert-ai/plugin-echarts-mcp-app>@modelcontextprotocol/sdk': 1.29.0
  zod: 3.25.67
  web-streams-polyfill: ^4.2.0
  ws: 8.18.0
  zod-to-json-schema: 3.25.2

# pnpm 10.24 uses onlyBuiltDependencies; allowBuilds requires 10.26 or newer.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@compodoc/compodoc'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - aws-sdk
  - core-js
  - cypress
  - es5-ext
  - electron
  - esbuild
  - ffmpeg-ffprobe-static
  - isolated-vm
  - less
  - lmdb
  - msgpackr-extract
  - ngx-float-ui
  - ngx-popperjs
  - node-pty
  - nx
  - protobufjs
  - sharp
  - unrs-resolver
