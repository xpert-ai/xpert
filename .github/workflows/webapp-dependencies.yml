# Image construction and health checks run once in the calling release workflow.
name: Validate Web dependency isolation

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: node --test .deploy/webapp/dependencies.test.cjs
      - name: Check frontend-only dependency lock
        run: node .deploy/webapp/dependencies.cjs check
