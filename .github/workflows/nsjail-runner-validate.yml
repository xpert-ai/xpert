# PR merge refs can disappear before queued jobs start. Validate the event's
# source SHA, and never substitute the current branch tip for that revision.
name: Validate NsJail Runner

on:
  pull_request:
    paths:
      - '.deploy/nsjail-runner/**'
      - 'packages/sandbox-runtime/images/compute/**'
      - 'packages/sandbox-runtime/images/document-node/**'
      - 'packages/sandbox-runtime/images/document-java/**'
      - 'packages/sandbox-runtime/scripts/*document*'
      - 'packages/server-ai/src/sandbox/sandbox-job/runtime-definitions/document-node-20-v1.json'
      - 'packages/server-ai/src/sandbox/sandbox-job/runtime-definitions/document-java-17-v1.json'
      - 'packages/sandbox-runtime/images/browser/runtime/runner-host.mjs'
      - 'packages/server-ai/src/sandbox/sandbox-job/runtime-definitions/compute-node-python-v1.json'
      - '.github/workflows/nsjail-runner-validate.yml'
      - '.github/tests/nsjail-checkout.test.mjs'
      - '.github/tests/nsjail-disk.test.mjs'
      - '.github/scripts/prepare-nsjail-disk.sh'
      - 'package.json'
  push:
    branches:
      - develop
      - main
    paths:
      - '.deploy/nsjail-runner/**'
      - 'packages/sandbox-runtime/images/compute/**'
      - 'packages/sandbox-runtime/images/document-node/**'
      - 'packages/sandbox-runtime/images/document-java/**'
      - 'packages/sandbox-runtime/scripts/*document*'
      - 'packages/server-ai/src/sandbox/sandbox-job/runtime-definitions/document-node-20-v1.json'
      - 'packages/server-ai/src/sandbox/sandbox-job/runtime-definitions/document-java-17-v1.json'
      - 'packages/sandbox-runtime/images/browser/runtime/runner-host.mjs'
      - 'packages/server-ai/src/sandbox/sandbox-job/runtime-definitions/compute-node-python-v1.json'
      - '.github/workflows/nsjail-runner-validate.yml'
      - '.github/tests/nsjail-checkout.test.mjs'
      - '.github/tests/nsjail-disk.test.mjs'
      - '.github/scripts/prepare-nsjail-disk.sh'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    name: Validate xpert-nsjail-runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_PRIVILEGED_PROBE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          basic_credential="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic_credential"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${basic_credential}" \
            fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          unset basic_credential
          git checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$CHECKOUT_SHA" ]] || exit 1

      - name: Test CI checkout and disk preparation
        run: node --test .github/tests/nsjail-*.test.mjs

      - name: Run Runner unit tests
        run: corepack pnpm run test:nsjail-runner

      - name: Reserve disk space for Runner rootfs builds
        if: env.RUN_PRIVILEGED_PROBE == 'true'
        run: bash .github/scripts/prepare-nsjail-disk.sh

      - name: Build temporary Runner image
        if: env.RUN_PRIVILEGED_PROBE == 'true'
        run: docker build --progress=plain --file .deploy/nsjail-runner/Dockerfile --tag xpert-nsjail-runner:ci .

      - name: Run Runner isolation probe
        if: env.RUN_PRIVILEGED_PROBE == 'true'
        shell: bash
        run: |
          workspace="$(mktemp -d)"
          # NsJail drops privileges before resolving bind sources, so the jail UID needs traverse-only access.
          chmod 0711 "$workspace"
          token="$(openssl rand -hex 32)"
          echo "RUNNER_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          docker run --detach \
            --name xpert-nsjail-runner-ci \
            --privileged \
            --cgroupns=host \
            --security-opt apparmor=unconfined \
            --env XPERT_NSJAIL_RUNNER_TOKEN="$token" \
            --env XPERT_NSJAIL_MEMORY_BYTES=134217728 \
            --env XPERT_NSJAIL_CPU_MS_PER_SEC=200 \
            --env XPERT_NSJAIL_PIDS=32 \
            --env XPERT_NSJAIL_RLIMIT_AS_MB=512 \
            --env XPERT_NSJAIL_RLIMIT_FSIZE_MB=2 \
            --env XPERT_NSJAIL_RLIMIT_NOFILE=64 \
            --volume "$workspace:/sandbox" \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            xpert-nsjail-runner:ci
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' xpert-nsjail-runner-ci)"
            [[ "$status" == healthy ]] && break
            [[ "$status" == unhealthy ]] && exit 1
            sleep 1
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' xpert-nsjail-runner-ci)" == healthy ]]
          docker exec xpert-nsjail-runner-ci python3 /app/poc_validate.py
          docker exec xpert-nsjail-runner-ci python3 /app/verify_compute.py
          docker exec xpert-nsjail-runner-ci python3 /app/verify_documents.py

      - name: Report Runner build disk usage
        if: always() && env.RUN_PRIVILEGED_PROBE == 'true'
        run: |
          df -h /
          docker system df || true
          docker builder du || true

      - name: Clean up Runner isolation probe
        if: always() && env.RUN_PRIVILEGED_PROBE == 'true'
        run: |
          docker rm --force xpert-nsjail-runner-ci >/dev/null 2>&1 || true
          docker image rm --force xpert-nsjail-runner:ci >/dev/null 2>&1 || true
          [[ -z "${RUNNER_WORKSPACE:-}" ]] || rm -rf "$RUNNER_WORKSPACE"
