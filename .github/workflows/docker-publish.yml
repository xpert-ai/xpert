# Invariants: validate the exact source SHA and publish the health-checked image.
# PRs build without registry credentials; retries reuse the verified artifact.
name: Publish Application Docker images

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: application-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check application image Changesets
    if: github.repository == 'xpert-ai/xpert'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
      validate: ${{ steps.plan.outputs.validate }}
      validation_matrix: ${{ steps.plan.outputs.validation_matrix }}
      validate_api: ${{ steps.plan.outputs.validate_api }}
      validate_web: ${{ steps.plan.outputs.validate_web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install release-plan tools only
        run: npm ci --prefix .deploy/application-images/release-tools --ignore-scripts --no-audit --no-fund
      - name: Test image selection and release gates
        run: node --test .deploy/application-images/*.test.mjs
      - name: Select images and verify release declarations
        id: plan
        env:
          IMAGE_RELEASE_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMAGE_RELEASE_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_RELEASE_EVENT: ${{ github.event_name }}
          IMAGE_RELEASE_REF: ${{ github.ref }}
        run: |
          image_release_main_sha="$(git rev-parse refs/remotes/origin/main)"
          IMAGE_RELEASE_MAIN="$image_release_main_sha" node .deploy/application-images/release-plan.mjs

  validate-api:
    needs: prepare
    if: needs.prepare.outputs.validate_api == 'true'
    uses: ./.github/workflows/api-runtime-dependencies.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}

  validate-web:
    needs: prepare
    if: needs.prepare.outputs.validate_web == 'true'
    uses: ./.github/workflows/webapp-dependencies.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}

  build:
    needs: [prepare, validate-api, validate-web]
    if: >-
      ${{ github.event_name == 'push' && always() && !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.validate == 'true' &&
          (needs.validate-api.result == 'success' || needs.validate-api.result == 'skipped') &&
          (needs.validate-web.result == 'success' || needs.validate-web.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-application-images.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      matrix: ${{ needs.prepare.outputs.validation_matrix }}
      write-cache: true

  build-pr:
    needs: [prepare, validate-api, validate-web]
    if: >-
      ${{ github.event_name == 'pull_request' && always() && !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.validate == 'true' &&
          (needs.validate-api.result == 'success' || needs.validate-api.result == 'skipped') &&
          (needs.validate-web.result == 'success' || needs.validate-web.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-application-images.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      matrix: ${{ needs.prepare.outputs.validation_matrix }}
      write-cache: false

  publish:
    name: Publish ${{ matrix.image_name }}
    needs: [prepare, build]
    # Optional dependency validators may be skipped for API-only/Web-only pushes.
    # Require the completed build explicitly, without inheriting their skipped status.
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LOCAL_IMAGE: ${{ matrix.image_name }}:check-${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: verified-${{ matrix.image_name }}-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/verified-image
      - name: Load verified image
        run: docker load -i "$RUNNER_TEMP/verified-image/image.tar"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            metadc/${{ matrix.image_name }}
            registry.cn-hangzhou.aliyuncs.com/metad/${{ matrix.image_name }}
          flavor: |
            latest=false
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}

      - name: Push the verified image without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_VERSION: ${{ matrix.version }}
          IMAGE_SHA: ${{ needs.prepare.outputs.sha }}
          VERIFIED_IMAGE_ID_FILE: ${{ runner.temp }}/verified-image/image.id
        run: node .deploy/application-images/publish-verified-image.mjs
