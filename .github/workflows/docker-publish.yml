name: Publish Application Docker images

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Check application image Changesets
    if: github.repository == 'xpert-ai/xpert'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install release-plan tools only
        run: npm ci --prefix .deploy/application-images/release-tools --ignore-scripts --no-audit --no-fund
      - name: Test image selection and release gates
        run: node --test .deploy/application-images/*.test.mjs
      - name: Select images and verify release declarations
        id: plan
        env:
          IMAGE_RELEASE_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMAGE_RELEASE_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_RELEASE_EVENT: ${{ github.event_name }}
          IMAGE_RELEASE_REF: ${{ github.ref }}
        run: node .deploy/application-images/release-plan.mjs

  publish:
    name: Publish ${{ matrix.image_name }}
    needs: prepare
    if: github.event_name == 'push' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            metadc/${{ matrix.image_name }}
            registry.cn-hangzhou.aliyuncs.com/metad/${{ matrix.image_name }}
          flavor: |
            latest=false
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            NODE_OPTIONS=${{ matrix.node_options }}
          platforms: linux/amd64
          outputs: type=image,push=true,oci-artifact=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=inline
