name: Diagnose Windows Shell cache
on:
  pull_request:
    paths:
      - 'apps/desktop/scripts/diagnose-windows-shell.cjs'
      - '.github/workflows/windows-shell-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare PowerShell module caches
        shell: bash
        run: node apps/desktop/scripts/diagnose-windows-shell.cjs
